# .github/workflows/dxc-build.yml
# Phase 70 (issue #287): builds the pinned DXC (v1.9.2607, 0d3ee6b55) for Windows.
#
# Why Windows is built here. ShadowDusk redistributes no binary from Microsoft's DXC release,
# because that release carries LICENSE-MS.txt, whose distribution terms include indemnifying
# Microsoft (owner decision, see project_decisions.md). The source at this tag is under the LLVM
# release licence and the third-party licences it lists, and those are what these builds carry.
# win-arm64 could not use Microsoft's files anyway: its "arm64" v1.9.2607 DLLs are ARM64EC
# (microsoft/DirectXShaderCompiler#8934), which a native arm64 process cannot load.
#
# THE SAME COMPILER, NEVER A SUBSTITUTE: the source is the v1.9.2607 tag with its gitlinked
# submodules, and the build reproduces the version stamp Microsoft's release carries
# ("1.9.0.5402 (0d3ee6b55-dirty)"), which DXC writes into every DXIL container: full history (the
# fourth field is the commit count), a detached HEAD, a nine-digit short hash and a dirty tree.
# The dirt is one newline in README.md, which nothing compiles.
#
# Each job fails unless the files are for the right architecture (classic ARM64, never ARM64EC),
# carry that stamp, and compile the probe shaders to the SAME BYTES as Microsoft's x64 release of
# the tag (used here only as a measuring reference, never uploaded; under emulation on arm64),
# with DXC's internal validator and again through the dxil.dll built here.
#
# The files are uploaded as run artifacts. Nothing here publishes: they are attached to a NEW
# release tag (never replacing an asset) and their SHA-256 pinned in tools/restore.*.
name: Build DXC Windows natives (v1.9.2607)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DXC_COMMIT: '0d3ee6b551b8fa768fbf825300ebab81047ef6a8'
  DXC_STAMP: '1.9.0.5402 (0d3ee6b55-dirty)'
  SPIRV_HEADERS_COMMIT: '29981f65241605e08b0ede4cfeb999fe3b723c6a'
  SPIRV_TOOLS_COMMIT: 'b707790a898e44038547df54580022fc1cf89c3d'
  DIRECTX_HEADERS_COMMIT: '980971e835876dc0cde415e8f9bc646e64667bf7'
  # Microsoft's own x64 build of the tag: the byte reference for the probe shaders.
  MS_DXC_NUPKG: 'https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.dxc/1.9.2607.13/microsoft.direct3d.dxc.1.9.2607.13.nupkg'
  MS_DXC_NUPKG_SHA256: '5d6acd23089b2979a3c1d39b7e31227da989a47b5d9f3db57111ad4717ea537e'

jobs:
  build:
    name: Build ${{ matrix.rid }} dxcompiler + dxil
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            vcvars: vcvars64.bat
            machine: '0x8664'
          - rid: win-arm64
            os: windows-11-arm
            vcvars: vcvarsarm64.bat
            machine: '0xAA64'
    steps:
      - name: Fetch the pinned source (full history, for the version stamp)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config --global core.longpaths true
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/DirectXShaderCompiler.git dxc-src
          git -C dxc-src config core.abbrev 9
          git -C dxc-src config core.autocrlf false
          git -C dxc-src -c advice.detachedHead=false checkout $env:DXC_COMMIT
          git -C dxc-src submodule update --init --depth 1 external/SPIRV-Headers external/SPIRV-Tools external/DirectX-Headers
          foreach ($pair in @(
              "external/SPIRV-Headers=$env:SPIRV_HEADERS_COMMIT",
              "external/SPIRV-Tools=$env:SPIRV_TOOLS_COMMIT",
              "external/DirectX-Headers=$env:DIRECTX_HEADERS_COMMIT")) {
            $path, $want = $pair -split '='
            $have = git -C "dxc-src/$path" rev-parse HEAD
            if ($have -ne $want) { throw "$path is at $have, pinned $want" }
          }
          Add-Content -Path dxc-src/README.md -Value ''
          $count = git -C dxc-src rev-list --count HEAD
          if ($count -ne '5402') { throw "commit count $count, the stamp needs 5402" }

      - name: Configure and build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VSROOT=%%i
          call "%VSROOT%\VC\Auxiliary\Build\${{ matrix.vcvars }}" || exit /b 1
          cmake -G Ninja -S dxc-src -B build ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DENABLE_SPIRV_CODEGEN=ON ^
            -DLLVM_INCLUDE_TESTS=OFF -DCLANG_INCLUDE_TESTS=OFF ^
            -DHLSL_INCLUDE_TESTS=OFF -DSPIRV_BUILD_TESTS=OFF ^
            -DLLVM_INCLUDE_DOCS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF ^
            -C dxc-src/cmake/caches/PredefinedParams.cmake || exit /b 1
          ninja -C build dxcompiler dxildll dxc || exit /b 1

      - name: Verify architecture, stamp, and bytes against Microsoft's x64 build
        shell: pwsh
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out, ms, probe | Out-Null
          Copy-Item build/bin/dxcompiler.dll, build/bin/dxil.dll out/

          foreach ($f in 'dxcompiler.dll', 'dxil.dll') {
            $bytes = [IO.File]::ReadAllBytes("out/$f")
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            if ($machine -ne [Convert]::ToUInt16($env:EXPECTED_MACHINE, 16)) {
              throw ("{0}: PE machine 0x{1:X4}, expected {2}" -f $f, $machine, $env:EXPECTED_MACHINE)
            }
            $v = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "out/$f").Path)
            $stamp = "$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart).$($v.FilePrivatePart)"
            $tag = [regex]::Match($v.ProductVersion, '\(([^)]+)\)').Groups[1].Value
            if ("$stamp ($tag)" -ne $env:DXC_STAMP) { throw "$f is stamped '$stamp ($tag)', expected '$env:DXC_STAMP'" }
          }

          Invoke-WebRequest $env:MS_DXC_NUPKG -OutFile ms/dxc.zip
          if ((Get-FileHash ms/dxc.zip -Algorithm SHA256).Hash -ne $env:MS_DXC_NUPKG_SHA256) { throw 'Microsoft package hash mismatch' }
          Expand-Archive ms/dxc.zip ms/x
          $ref = 'ms/x/build/native/bin/x64/dxc.exe'
          $own = 'build/bin/dxc.exe'
          $validator = (Resolve-Path 'build/bin/dxil.dll').Path

          Set-Content probe/a.hlsl 'float4 main(float4 c : COLOR0) : SV_Target { return c.bgra * 0.5; }'
          Set-Content probe/b.hlsl @'
          Texture2D T : register(t0); SamplerState S : register(s0);
          cbuffer C : register(b0) { float4x4 M; float4 K; };
          float4 main(float4 p : SV_Position, float2 uv : TEXCOORD0) : SV_Target {
            float4 c = T.Sample(S, uv);
            for (int i = 0; i < 4; i++) c.rgb = lerp(c.rgb, K.rgb, 0.25);
            return mul(M, c) * (uv.x > 0.5 ? K : c);
          }
          '@
          foreach ($src in 'a', 'b') {
            foreach ($mode in @('-T', 'ps_6_0'), @('-T', 'ps_6_0', '-spirv')) {
              $suffix = if ($mode.Count -eq 3) { 'spv' } else { 'dxil' }
              & $ref @mode -E main -Fo "probe/$src.ref.$suffix" "probe/$src.hlsl"
              if ($LASTEXITCODE -ne 0) { throw "reference compile of $src ($suffix) failed" }
              & $own @mode -E main -Fo "probe/$src.own.$suffix" "probe/$src.hlsl"
              if ($LASTEXITCODE -ne 0) { throw "self-built compile of $src ($suffix) failed" }
              $r = (Get-FileHash "probe/$src.ref.$suffix").Hash
              $o = (Get-FileHash "probe/$src.own.$suffix").Hash
              "$src.$suffix ref $r own $o"
              if ($r -ne $o) { throw "$src ($suffix): the self-built DXC differs from Microsoft's x64 build" }
              if ($suffix -eq 'dxil') {
                # dxc.exe validates through the DLL this variable names; the library never reads it.
                $env:DXC_DXIL_DLL_PATH = $validator
                & $own @mode -E main -Fo "probe/$src.ext.$suffix" "probe/$src.hlsl"
                $code = $LASTEXITCODE
                Remove-Item Env:DXC_DXIL_DLL_PATH
                if ($code -ne 0) { throw "compile of $src through the self-built dxil.dll failed" }
                $e = (Get-FileHash "probe/$src.ext.$suffix").Hash
                "$src.$suffix through self-built dxil.dll $e"
                if ($e -ne $r) { throw "${src}: validating through the self-built dxil.dll changed the bytes" }
              }
            }
          }
          Get-FileHash out/*.dll -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Tee-Object out/SHA256SUMS

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: dxc-${{ matrix.rid }}
          path: out/
          if-no-files-found: error
          retention-days: 30
