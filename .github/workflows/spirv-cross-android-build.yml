# .github/workflows/spirv-cross-android-build.yml
# Builds ShadowDusk's Android SPIRV-Cross (libspirv-cross.so for android-arm64 and android-x64)
# with the ONE recipe, tools/build-spirv-cross-android.sh, which pins everything that decides the
# bytes:
#
#   SPIRV-Cross  d8e3e2b141b8c8a167b2e3984736a6baacff316c (2025-07-01, Merge #2497), the commit
#                the DESKTOP natives (Silk.NET.SPIRV.Cross.Native 2.23.0) are built from, so the
#                Android GLSL is the desktop GLSL (one faithful pipeline). Measured from the
#                binaries, not taken from Silk.NET's submodule pointer (see project_facts.md).
#   NDK          r27c (27.2.12479018), installed here by sdkmanager and checked by the script.
#   API level    21.
#   CMake        Release, SPIRV_CROSS_SHARED=ON, STATIC/CLI/TESTS OFF,
#                ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON (16 KB pages), -g0 + -ffile-prefix-map,
#                git lookup disabled and the version stamp pinned to the commit.
#
# Reproducibility is checked, not assumed: the recipe runs twice in different directories and the
# job fails unless both runs give the same bytes. The files are uploaded as a run artifact; a
# maintainer attaches them to a NEW release tag (never replacing an asset) and pins their SHA-256
# in tools/restore.* and their GNU build ids in SpvcLoader.AndroidBuildIdByRid.
name: Build SPIRV-Cross Android natives

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/build-spirv-cross-android.sh'
      - '.github/workflows/spirv-cross-android-build.yml'
      - 'tools/restore.sh'
      - 'tools/restore.ps1'

# Builds and uploads a run artifact only; publishing to a release is a deliberate manual step.
permissions:
  contents: read

jobs:
  build:
    name: Build libspirv-cross.so (android-arm64 + android-x64, NDK r27c)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install NDK r27c
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.2.12479018' > /dev/null
          cat "$ANDROID_HOME/ndk/27.2.12479018/source.properties"

      - name: Build (twice, in different directories)
        run: |
          chmod +x tools/build-spirv-cross-android.sh
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          tools/build-spirv-cross-android.sh "$ndk" out "$RUNNER_TEMP/spvc-a"
          tools/build-spirv-cross-android.sh "$ndk" "$RUNNER_TEMP/out-b" "$RUNNER_TEMP/spvc-second-run"

      - name: Require byte-identical rebuilds
        run: |
          for rid in android-arm64 android-x64; do
            a=$(sha256sum "out/$rid/libspirv-cross.so" | cut -d' ' -f1)
            b=$(sha256sum "$RUNNER_TEMP/out-b/$rid/libspirv-cross.so" | cut -d' ' -f1)
            echo "$rid $a $b"
            [ "$a" = "$b" ] || { echo "::error::$rid: two builds of the same recipe differ"; exit 1; }
          done

      - name: Require the build to equal the shipped, pinned natives
        # A script, flag, NDK or SPIRV_CROSS_REF change must re-host and re-pin in the same PR,
        # or the committed recipe would silently stop producing the bytes ShadowDusk ships.
        run: |
          for pair in android-arm64:SPVC_ANDROID_ARM64_SHA256 android-x64:SPVC_ANDROID_X64_SHA256; do
            rid="${pair%%:*}"; var="${pair##*:}"
            pin=$(grep "^${var}=" tools/restore.sh | cut -d'"' -f2)
            got=$(sha256sum "out/$rid/libspirv-cross.so" | cut -d' ' -f1)
            echo "$rid built $got pinned $pin"
            [ -n "$pin" ] || { echo "::error::$var not found in tools/restore.sh"; exit 1; }
            [ "$got" = "$pin" ] || { echo "::error::$rid: the recipe no longer produces the pinned native; re-host and re-pin"; exit 1; }
          done

      - name: Verify ABI, C API exports, 16 KB alignment, build ids
        run: |
          llvm_readelf="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for pair in android-arm64:AArch64 android-x64:X86-64; do
            rid="${pair%%:*}"; machine="${pair##*:}"
            so="out/$rid/libspirv-cross.so"
            "$llvm_readelf" -h "$so" | grep -q "Machine:.*$machine" || { echo "::error::$rid is not $machine"; exit 1; }
            "$llvm_readelf" -W --dyn-syms "$so" | grep -q ' spvc_context_create$' \
              || { echo "::error::$rid does not export the spvc_* C API"; exit 1; }
            if "$llvm_readelf" -W -l "$so" | awk '$1=="LOAD" {print $NF}' | grep -qv '0x4000'; then
              echo "::error::$rid has a LOAD segment not aligned to 16 KB"; exit 1
            fi
            echo "$rid build id: $("$llvm_readelf" -n "$so" | sed -n 's/.*Build ID: //p')"
          done
          (cd out && sha256sum */libspirv-cross.so | tee SHA256SUMS)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spirv-cross-android
          path: out/
          if-no-files-found: error
          retention-days: 30
