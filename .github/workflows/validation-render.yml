# .github/workflows/validation-render.yml
# Phase 44 C — promote the manual `validation/*` real-engine render gates into CI,
# where a software/headless driver exists.
#
# The product bar is "loads + renders like the reference compiler in the REAL engine"
# (CLAUDE.md). That bar lives in the validation/* console drivers, which `dotnet test`
# does NOT run. This workflow runs the ones that (a) render through a real MonoGame
# DesktopGL device and (b) self-assert in process (exit 0 iff every row matched the
# committed mgfxc golden within tolerance) — so they need no Python compare and no
# baseline-generation step. Mesa's llvmpipe software rasterizer under xvfb gives the
# headless runner a real GL 4.5 context (the same proven recipe wasm.yml uses for its
# DesktopGL reference renderer), so a GL-init failure is a NATURAL red (MonoGame throws
# NoSuitableGraphicsDevice -> non-zero exit), never a silent skip.
#
# GL render gates wired here (each is `Category`-free, self-asserting, net8.0 + DesktopGL):
#   * StateFidelity          — Phase 43 pass render-states / annotations / baked sampler
#                              states load + render vs mgfxc golden.
#   * CbufferModel           — Phase 43C cbuffer + array-parameter-by-name model.
#   * TextureBreadthValidation — Phase 34 cube + 3D/volume texture render (rung-4).
#   * ReservedWordGl         — Phase 45 B10 reserved-word free uniform ('float noise;')
#                              binds by name + drives the output on the GL offset-bridge
#                              path (exact expected pixels; no mgfxc needed in CI).
#   * SamplerPairsGl         — Phase 51 A7 per-(texture, sampler)-PAIR sampler records:
#                              each pair binds its own texture, and each carries its own
#                              baked sampler state, in SPIRV-Cross's declaration order
#                              (asymmetric scenes with exact expected pixels).
#   * SamplerRegisterOrderGl — issue #189: GL sampler SLOTS must follow HLSL declaration
#                              order (fxc's rule), not SPIRV-Cross's first-use order. The
#                              only GL gate that leaves unit 0 to SpriteBatch instead of
#                              binding every texture through effect.Parameters[...] — which
#                              is exactly what makes the slot numbering observable, and why
#                              every other gate stayed green while this shipped broken.
#   * DeferredSpriteMrtGl    — Phase 51 A2 true MULTIPLE-RENDER-TARGET proof: the ONLY
#                              gate here that binds two render targets and reads BOTH
#                              attachments back. Every other GL gate is single-target, so
#                              nothing else can tell "COLOR1 reached attachment 1" from
#                              "the second output went nowhere".
#   * ShaderToyRouteGl       — Phase 51 A5 the ShaderToy / `.glsl` FRONTEND route: convert
#                              in process, pin the result against the committed .fx the
#                              golden was built from, then render ShadowDusk's build and
#                              mgfxc's build of that same .fx and diff. The only gate that
#                              covers the converter -> pipeline route end to end.
#   * RaylibRoute            — Phase 59 the raylib converter: each shader's glsl330 emission
#                              rendered in REAL Raylib-cs (raylib 6.0, GLFW) and pixel-diffed
#                              against the same .fx built for OpenGL in real MonoGame DesktopGL.
#                              The evidence model is rendered-image fidelity (raylib has no
#                              reference compiler), with three positive controls that must
#                              diverge.
#   * SkiaVsKni              — issue #369 (Phase 62 Area D2) the SkSL converter: XnaFiddle's
#                              texture-only shaders through SkslConverter in REAL SkiaSharp (CPU
#                              raster) vs the same .fx built for OpenGL in REAL KNI v4.2.9001
#                              SDL2.GL, untinted and tinted, tol 2/255, three positive controls
#                              that must diverge. Single process; the KNI arm needs the GL context.
#                              With RaylibRoute, the only gates that drive a non-MonoGame runtime.
#   * Baseline+Candidate+compare.py — the 10-shader GL corpus, ShadowDusk vs the
#                              committed mgfxc OpenGL goldens, real MonoGame DesktopGL. The
#                              GL twin of the DX job's BaselineDx pair. Its distinct value is a
#                              SECOND rasterizer for the precision-shaped shaders: Dots calls
#                              sin() on ~792-radian arguments, which a weak GPU's large-argument
#                              reduction gets wrong (see docs/validation-matrix.md §7), and
#                              llvmpipe is the neutral judge of whether the OUTPUT is right.
#
# DX render gates wired here (issue #204, windows-latest, pinned to WARP — Windows'
# bundled software D3D rasterizer — via SHADOWDUSK_DX_WARP=1, same recipe proven in
# vchelaru/SkiaGameRendering's WindowsDX CI job; no driver install needed, unlike GL).
# All three measured GREEN on a real windows-latest run (not just a local GPU box):
#   * DxModernFeatures       — DX11 vertex-texture-fetch: vkd3d (shipping) vs
#                              d3dcompiler/fxc oracle, real MonoGame WindowsDX. The
#                              flagship gate here: single process, self-asserting exit
#                              code, no Python, no external mgfxc invocation.
#   * KniWinFormsDX          — DX11 ShadowDusk vs the committed mgfxc goldens, real KNI
#                              WinForms.DX11 (proves WARP extends to KNI's DX backend,
#                              which carries the pin on PresentationParameters rather
#                              than MonoGame's static GraphicsAdapter.UseDriverType).
#   * BaselineDx+CandidateDx+compare_dx.py — DX11 corpus, ShadowDusk vs the committed
#                              mgfxc DirectX_11 goldens, real MonoGame WindowsDX.
#   * BaselineDx12+CandidateDx12+compare_dx12.py — DX12 corpus (issue #209), MEASURED GREEN
#                              on a real windows-latest run (maxd 0, 10/10). Root cause of
#                              the original #204 RED: MonoGame.Framework.Native's SDL2
#                              window creation is compiled with SDL_WINDOW_VULKAN baked in
#                              for any DX12/Vulkan build (native/monogame/sdl/MGP_sdl.cpp,
#                              upstream MonoGame — not a runtime flag, no MonoGame-side or
#                              SDL hint exists to skip it), so SDL_CreateWindow always
#                              probes for a working Vulkan loader + WSI surface extensions
#                              regardless of the WARP pin, and windows-latest ships neither.
#                              Fixed by installing Google SwiftShader (a CPU Vulkan ICD) via
#                              jakoch/install-vulkan-sdk-action, which also drops a loader
#                              (`vulkan-1.dll`) next to the ICD — added to PATH so SDL's
#                              dlopen finds it. WARP still does the actual D3D12 rendering;
#                              Vulkan here is load-bearing only for SDL's window-creation
#                              probe, never for a pixel.
#   * SlangFullCorpus -f net8.0-windows -- --skip-gl-gate (issue #254) — the real-slangc
#                              ShadowDusk.Slang route: gate 1 (21 shaders x OpenGL/DirectX_11/
#                              DirectX12/Vulkan compile through the win-x64 slangc restore.ps1
#                              fetches) and gate 3 (all 21 DirectX_11 outputs load into a REAL
#                              MonoGame WindowsDX Effect on WARP and draw one frame). Gate 3
#                              carries its own positive control: a real .mgfx truncated to half
#                              (cache key inverted) must be REJECTED by the Effect loader, or
#                              the gate fails (that failure branch measured locally, when the
#                              first draft of the control loaded). The STEP was proven red once
#                              in real CI by a throwaway commit corrupting every gate-3 row
#                              (run 37254580107), then green with it reverted. No reference
#                              compiler needed (a load gate, not an mgfxc diff). Gate 2 needs
#                              an OpenGL 3.3 context the runner lacks; it runs in the GL job.
#
# Vulkan render gates wired here (vulkan-render-gates job, ubuntu-latest, 2026-10-01): real
# MonoGame DesktopVK (MonoGame.Runtime.Linux.Vulkan) on Mesa lavapipe (CPU Vulkan) under xvfb.
# Every run goes through validation/run-with-vk-validation.sh, which forces the Khronos
# validation layer on and fails on any layer ERROR even when the pixels match: a CPU driver
# can accept what a GPU driver rejects, and the layer judges against the spec instead.
# Picked over SwiftShader on windows-latest because lavapipe hosted DesktopVK on the first
# measured run and needs only apt (an elevated Windows runner ignores VK_ICD_FILENAMES, so a
# non-SDK ICD there needs registry writes).
#   * VsDrivenVulkan         — VS-driven fixture vs the mgfxc 3.8.5 Vulkan golden (maxd 0),
#                              then `-- apos`, the Apos.Shapes gallery (maxd 0).
#   * CandidateVulkan        — the 10-shader PS corpus, own-output only (mgfxc's Vulkan output
#                              is unloadable for it, upstream SlotOffset bug).
#   * Two POSITIVE CONTROLS  — a wrong shader must fail the pixel diff, and SPIR-V stamped 1.3
#                              on MonoGame's Vulkan 1.0 instance must trip the layer (lavapipe
#                              renders it at maxd 0, which is exactly why the layer is here).
#
# NOT here (issue #204 follow-ups, still manual-only via run-windows-render-gates.ps1):
#   * VsDrivenDx (Apos.Shapes gallery, real NuGet package) + ShaderToyRouteDx (converter
#     route) — heavier DX11 gates, left out of the day-one CI job on purpose; nothing
#     about WARP is expected to be different for them, they just weren't the smallest
#     first step.
#   * VsDrivenDx12 — same reasoning as VsDrivenDx; the issue #209 SwiftShader fix should
#     carry over (same SDL_WINDOW_VULKAN precondition), but wiring it in is a follow-up,
#     not the smallest next step.
#   * FNA (validation/FnaValidation) — needs its own restore-fna.ps1 (heavy, clones the
#     FNA source tree) and fxc /T fx_2_0, not evaluated for WARP here.
#   * VsDriven (the Apos.Shapes GL gate) — still manual; the 10-shader GL corpus
#     (Baseline+Candidate+compare.py) now RUNS here, which is also the second
#     rasterizer the precision-shaped shaders (Dots, Scanlines) are judged against.
name: Validation Render Gates

on:
  # Standing regression coverage on main (the matrix's whole point: a validation/*
  # gate cannot silently rot). On PRs it is opt-in via the `run-validation-render`
  # label (GL-on-llvmpipe is environment-sensitive, so it does not block every PR);
  # plus manual dispatch. Mirrors the integration-tests cadence in ci.yml.
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'validation/**'
      - 'tests/fixtures/**'
      - 'tools/restore.sh'
      - 'tools/restore.ps1'
      - '.github/workflows/validation-render.yml'
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled ]

# Least privilege for GITHUB_TOKEN: the GL render gates check out, build, render under
# llvmpipe, and upload the diff images as run artifacts. Nothing needs a write scope.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  gl-render-gates:
    name: GL render gates (ubuntu / Mesa llvmpipe)
    runs-on: ubuntu-latest
    # On a PR, only run when explicitly labelled run-validation-render (push-to-main and
    # manual dispatch always run). Keeps GL-on-software off the every-PR critical path.
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-validation-render')
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8 + .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The GL render path needs only DXC (Vortice.Dxc NuGet) + SPIRV-Cross
      # (Silk.NET.SPIRV.Cross.Native NuGet), both restored by `dotnet restore`. vkd3d is
      # NOT needed by these GL gates, so we do not hard-gate it here (unlike the DX/FNA
      # integration job). restore.sh is offline-tolerant; run it for parity only.
      - name: Restore native tools
        run: |
          chmod +x tools/restore.sh
          ./tools/restore.sh

      # Real GL rendering on a headless runner: MonoGame DesktopGL (SDL2) needs an X
      # display + a GL driver. xvfb provides the display, Mesa llvmpipe the software GL
      # context (advertises 4.5, covers the HiDef GraphicsProfile the gates request).
      # The libx*/libxkbcommon packages are SDL2's X11 client deps.
      - name: Install xvfb + Mesa software GL (DesktopGL render)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa mesa-utils \
            libx11-6 libxi6 libxrandr2 libxinerama1 libxcursor1 libxkbcommon0 \
            libsdl2-2.0-0

      # Put the driver evidence in the log (llvmpipe's advertised Compatibility version).
      - name: Verify llvmpipe GL (diagnostic)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a glxinfo -B || echo "::warning::glxinfo unavailable (diagnostic only)"

      - name: Build the GL render gates
        run: |
          dotnet build validation/StateFidelity/StateFidelity.csproj -c Release
          dotnet build validation/CbufferModel/CbufferModel.csproj -c Release
          dotnet build validation/TextureBreadthValidation/TextureBreadthValidation.csproj -c Release
          dotnet build validation/ReservedWordGl/ReservedWordGl.csproj -c Release
          dotnet build validation/SamplerPairsGl/SamplerPairsGl.csproj -c Release
          dotnet build validation/SamplerRegisterOrderGl/SamplerRegisterOrderGl.csproj -c Release
          dotnet build validation/DeferredSpriteMrtGl/DeferredSpriteMrtGl.csproj -c Release
          dotnet build validation/ShaderToyRouteGl/ShaderToyRouteGl.csproj -c Release
          dotnet build validation/RaylibRoute/RaylibRoute.csproj -c Release
          dotnet build validation/SkiaVsKni/SkiaVsKni.csproj -c Release

      # Each driver self-asserts (exit 0 iff every row loaded + matched its reference
      # within tolerance). Run all of them even if an earlier one fails, then fail the job
      # if any did, so one regression doesn't hide another. LIBGL_ALWAYS_SOFTWARE pins
      # llvmpipe even if a GPU device node exists, for deterministic software rendering.
      - name: Run GL render gates (real DesktopGL under xvfb/llvmpipe)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # No GL context => hard FAIL, never a pass-by-skip. StateFidelity/CbufferModel/
          # ReservedWordGl throw on a missing device (MonoGame NoSuitableGraphicsDevice ->
          # natural red); TextureBreadthValidation, SamplerPairsGl, SamplerRegisterOrderGl,
          # DeferredSpriteMrtGl, ShaderToyRouteGl, RaylibRoute and SkiaVsKni catch+skip, so this flag
          # turns their skip into a failure too (all seven read SHADOWDUSK_REQUIRE_GL).
          SHADOWDUSK_REQUIRE_GL: "1"
        run: |
          set +e
          rc=0
          for proj in StateFidelity CbufferModel TextureBreadthValidation ReservedWordGl SamplerPairsGl SamplerRegisterOrderGl DeferredSpriteMrtGl ShaderToyRouteGl RaylibRoute SkiaVsKni; do
            echo "::group::$proj"
            xvfb-run -a dotnet run --project "validation/$proj" -c Release --no-build
            this=$?
            echo "::endgroup::"
            if [ "$this" -ne 0 ]; then
              echo "::error::validation/$proj render gate FAILED (exit $this)"
              rc=1
            fi
          done
          exit $rc

      # ShadowDusk.Slang's real-slangc route on Linux (issue #227): validation/SlangFullCorpus
      # gate 1 (21 shaders compile through the real SlangCompiler on OpenGL/DirectX/DirectX12/
      # Vulkan, each parsed as MGFX) and gate 2 (the 8 uniform-free shaders render
      # pixel-identical through ShadowDusk's .fx-wrapped route vs slangc's raw HLSL, on
      # llvmpipe). Gate 3 (a real WindowsDX Effect load) is Windows-only and the driver prints
      # it as NOT RUN, never as a pass. slangc comes from tools/restore.sh above; a missing or
      # unrunnable slangc is a hard FAIL (exit 1), as is a missing GL context (GlHost throws).
      - name: Slang full corpus (real slangc on linux-x64, gates 1-2)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          dotnet build validation/SlangFullCorpus/SlangFullCorpus.csproj -c Release -f net8.0
          xvfb-run -a dotnet run --project validation/SlangFullCorpus -c Release -f net8.0 --no-build

      # Issue #252: the real-slangc route's textured shaders in REAL MonoGame DesktopGL with the
      # texture left to SpriteBatch (unit 0, never set by parameter). SlangFullCorpus above cannot
      # see which unit a sampler landed on; this checks the .mgfx sampler table and renders each
      # textured PS-only corpus shader against its own math on the CPU, plus Invert against the
      # committed mgfxc golden. SHADOWDUSK_REQUIRE_GL turns a no-device skip into a failure.
      - name: Slang textured GL (real slangc, SpriteBatch unit 0)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SHADOWDUSK_REQUIRE_GL: "1"
        run: |
          dotnet build validation/SlangTexturedGl/SlangTexturedGl.csproj -c Release
          xvfb-run -a dotnet run --project validation/SlangTexturedGl -c Release --no-build

      # The GL corpus is the two-process orchestration the in-process gates above avoid:
      # Baseline renders the committed mgfxc goldens, Candidate renders ShadowDusk's own
      # output for the same 10 shaders, and compare.py pixel-diffs the two sets. It is the
      # GL twin of the DX job's BaselineDx+CandidateDx+compare_dx.py, which proved the
      # pattern runs headless in CI. Its value here is hardware breadth: llvmpipe is a
      # second, non-vendor rasterizer for the shaders whose divergence is precision-shaped
      # (Dots, Scanlines) and which therefore read differently on different GPUs.
      - name: Install Python compare dependencies (pillow, numpy)
        run: python -m pip install --quiet pillow numpy

      - name: compare_kni.py golden-waiver self-test (issue #215, no GPU)
        run: python validation/compare_kni.py --self-test

      - name: Build the GL corpus drivers
        run: |
          dotnet build validation/Baseline/Baseline.csproj -c Release
          dotnet build validation/Candidate/Candidate.csproj -c Release

      - name: Run the GL corpus (real DesktopGL under xvfb/llvmpipe) + pixel-diff
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SHADOWDUSK_REQUIRE_GL: "1"
        run: |
          xvfb-run -a dotnet run --project validation/Baseline -c Release --no-build
          xvfb-run -a dotnet run --project validation/Candidate -c Release --no-build
          python validation/compare.py

      - name: Upload render outputs (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-render-output
          path: |
            validation/output-state/**
            validation/output-cbuffer/**
            validation/output-texbreadth/**
            validation/output-reservedword/**
            validation/output-samplerpairs/**
            validation/output-samplerregisterorder/**
            validation/output-mrt/**
            validation/output-shadertoy/**
            validation/output-raylib/**
            validation/output-skia-kni/**
            validation/output/baseline/**
            validation/output/candidate/**
            validation/output/diff/**
          if-no-files-found: ignore
          retention-days: 7

  dx-render-gates:
    name: DX render gates (windows-latest / WARP)
    runs-on: windows-latest
    # Same PR gating as the GL job: push-to-main and manual dispatch always run; a PR
    # only runs it when labelled (a Windows job is pricier CI minutes than Linux).
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-validation-render')
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8 + .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The DX gates need vkd3d-shader (the shipping DXBC backend) and DXC natives,
      # both win-x64 binaries fetched from this repo's own GitHub Releases (public,
      # no auth) by restore.ps1 — the same script the DX/KNI-DX/FNA integration tests
      # and run-windows-render-gates.ps1 already rely on.
      - name: Restore native tools (vkd3d-shader, DXC)
        run: ./tools/restore.ps1

      - name: Install Python compare dependencies (pillow, numpy)
        run: python -m pip install --disable-pip-version-check pillow numpy

      # Issue #209: MonoGame.Framework.Native's window creation is compiled with
      # SDL_WINDOW_VULKAN baked in for any DX12 build (see the header comment above), so
      # SDL_CreateWindow always dlopen's vulkan-1.dll and probes VK_KHR_surface/
      # VK_KHR_win32_surface, even though WARP does the actual D3D12 rendering. windows-latest
      # has neither a loader nor an ICD, so this installs Google SwiftShader (a CPU Vulkan
      # ICD) purely to satisfy that probe; the action registers it in the Vulkan ICD registry
      # for us, but does not add its bundled `vulkan-1.dll` to PATH, so the next step does.
      # Pinned to a commit SHA (v1.6.0), not the mutable tag, since this is a third-party
      # action. It queries the GitHub API for the SwiftShader release; without a token that
      # call shares the runner IP's unauthenticated quota and fails at random with "API rate
      # limit exceeded" (issue #317), so it gets the workflow's read-only token.
      - name: Install Vulkan software driver (SwiftShader) for DX12 SDL2 window creation
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          install_swiftshader: true
          swiftshader_destination: C:\Swiftshader

      - name: Add SwiftShader's vulkan-1.dll loader to PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Swiftshader'

      - name: Build the DX render gates
        run: |
          dotnet build validation/DxModernFeatures/DxModernFeatures.csproj -c Release
          dotnet build validation/KniWinFormsDX/KniWinFormsDX.csproj -c Release
          dotnet build validation/BaselineDx/BaselineDx.csproj -c Release
          dotnet build validation/CandidateDx/CandidateDx.csproj -c Release
          dotnet build validation/BaselineDx12/BaselineDx12.csproj -c Release
          dotnet build validation/CandidateDx12/CandidateDx12.csproj -c Release
          dotnet build validation/SlangFullCorpus/SlangFullCorpus.csproj -c Release -f net8.0-windows

      # Issue #204: pin every gate to WARP (Windows' bundled software D3D rasterizer)
      # instead of a hardware adapter — windows-latest has no GPU. SHADOWDUSK_DX_WARP is
      # opt-in (see validation/SharedDx/DxHeadlessRasterizer.cs), so a developer's local
      # `dotnet run` still renders on their real GPU; only this job's env sets it.
      - name: Run DX11 modern-features gate (vkd3d vs fxc oracle, real MonoGame WindowsDX)
        env:
          SHADOWDUSK_DX_WARP: "1"
        run: dotnet run --project validation/DxModernFeatures -c Release --no-build

      - name: Run KNI DirectX gate (ShadowDusk vs mgfxc, real KNI WinForms.DX11)
        env:
          SHADOWDUSK_DX_WARP: "1"
        run: dotnet run --project validation/KniWinFormsDX -c Release --no-build

      - name: Run MonoGame WindowsDX corpus (ShadowDusk vs mgfxc DirectX_11 golden)
        env:
          SHADOWDUSK_DX_WARP: "1"
        run: |
          dotnet run --project validation/BaselineDx -c Release --no-build
          dotnet run --project validation/CandidateDx -c Release --no-build
          python validation/compare_dx.py

      - name: Run MonoGame WindowsDX12 corpus (ShadowDusk vs mgfxc DirectX_12 golden)
        env:
          SHADOWDUSK_DX_WARP: "1"
        run: |
          dotnet run --project validation/BaselineDx12 -c Release --no-build
          dotnet run --project validation/CandidateDx12 -c Release --no-build
          python validation/compare_dx12.py

      # Issue #254: the real-slangc ShadowDusk.Slang route, gate 3 (the last unverified piece
      # of that package outside a dev box): every corpus shader's DirectX_11 output loads into a
      # REAL MonoGame WindowsDX Effect on WARP, plus the in-driver positive control (truncated
      # real bytes must be rejected). Gate 1 (the 84-cell compile sweep on win-x64 slangc) runs
      # too; --skip-gl-gate prints gate 2 as NOT RUN because this runner has no OpenGL 3.3
      # driver (gate 2 runs in the GL job above, on llvmpipe). slangc comes from restore.ps1; a
      # missing one is a hard FAIL. Runs even if an earlier DX gate failed, so one regression
      # cannot hide another.
      - name: Run Slang full corpus gates 1 + 3 (real slangc, real MonoGame WindowsDX Effect)
        if: ${{ !cancelled() }}
        env:
          SHADOWDUSK_DX_WARP: "1"
        run: dotnet run --project validation/SlangFullCorpus -c Release -f net8.0-windows --no-build -- --skip-gl-gate

      # Issue #254: validation/VsDrivenDx, every mode, real MonoGame WindowsDX on WARP. Each mode
      # renders the committed mgfxc DirectX_11 golden (.mgfx) AND ShadowDusk's in-process build in
      # the SAME process on the SAME WARP device, then diffs them in process, so no GPU-rendered
      # PNG is involved and both sides of every diff see the same rasterizer.
      #   vs      - VsTransformColorTexture (custom vertex buffer + float4x4), d3dcompiler_47 and
      #             vkd3d arms vs the golden, tol 4.
      #   apos    - the 30-cell Apos.Shapes ShapeBatch gallery through the real NuGet package:
      #             d3dcompiler_47 arm vs the real mgfxc golden (tol 1), vkd3d arm vs the package's
      #             embedded (itself vkd3d-compiled) effect (tol 0).
      #   texarr  - issue #339: Texture2D Tex[2] table equals mgfxc's record for record, and
      #             renders like the mgfxc 3.8.4.1 golden (tol 1), both DXBC backends.
      #   samparr - issue #340: a SamplerState array must be refused with SD0224 (no device).
      # Built here rather than in the shared build step so this step stands alone. All four run
      # even if one fails; the step fails if any did. Runs even if an earlier DX gate failed.
      - name: Run VsDrivenDx gates (VS rig, Apos.Shapes gallery, texture/sampler arrays vs mgfxc DirectX_11 golden)
        if: ${{ !cancelled() }}
        env:
          SHADOWDUSK_DX_WARP: "1"
        run: |
          dotnet build validation/VsDrivenDx/VsDrivenDx.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $failed = @()
          foreach ($mode in 'vs', 'apos', 'texarr', 'samparr') {
            Write-Host "::group::VsDrivenDx -- $mode"
            dotnet run --project validation/VsDrivenDx -c Release --no-build -- $mode
            $rc = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($rc -ne 0) {
              Write-Host "::error::validation/VsDrivenDx -- $mode FAILED (exit $rc)"
              $failed += $mode
            }
          }
          if ($failed.Count -gt 0) { Write-Host "VsDrivenDx failed modes: $($failed -join ', ')"; exit 1 }
          Write-Host "VsDrivenDx: all 4 modes passed (vs, apos, texarr, samparr)."

      - name: Upload VsDrivenDx render outputs (debug)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-render-output-dx-vsdriven
          path: |
            validation/output-vs-dx/**
            validation/output-apos-dx/**
            validation/output/texarr-dx11/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload render outputs (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-render-output-dx
          path: |
            validation/output-dx/**
            validation/output/baseline-dx12/**
            validation/output/candidate-dx12/**
            validation/output/diff-dx12/**
            validation/output-slang-full-corpus/**
          if-no-files-found: ignore
          retention-days: 7

  vulkan-render-gates:
    name: Vulkan render gates (ubuntu / Mesa lavapipe + Khronos validation layer)
    runs-on: ubuntu-latest
    # Same PR gating as the GL and DX jobs.
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-validation-render')
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8 + .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The Vulkan path needs DXC + SPIRV-Cross, both NuGet-restored; run restore.sh for
      # parity with the GL job.
      - name: Restore native tools
        run: |
          chmod +x tools/restore.sh
          ./tools/restore.sh

      # MonoGame DesktopVK on Linux is MonoGame.Runtime.Linux.Vulkan's libmgruntime.so, which
      # embeds SDL2 and dlopen's libvulkan.so.1 and the X11 client libs. xvfb provides the X
      # display, mesa-vulkan-drivers the lavapipe ICD (with xlib/xcb WSI), and
      # vulkan-validationlayers the Khronos validation layer every gate runs under.
      - name: Install xvfb + Mesa lavapipe + Vulkan loader + validation layer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools \
            vulkan-validationlayers \
            libx11-6 libx11-xcb1 libxext6 libxfixes3 libxi6 libxrandr2 libxinerama1 \
            libxcursor1 libxss1 libxkbcommon0
          python -m pip install --quiet pillow numpy

      # Pin Mesa's lavapipe (CPU Vulkan) as the only ICD, so a runner image that ever grows
      # another driver cannot change what judged the pixels. The manifest's file name varies
      # across Mesa packagings, so it is located rather than hard-coded; none found = red.
      - name: Pin lavapipe as the only Vulkan ICD
        run: |
          ls -l /usr/share/vulkan/icd.d/ /usr/share/vulkan/explicit_layer.d/
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          [ -n "$icd" ] || { echo "::error::Mesa lavapipe ICD manifest not found"; exit 1; }
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"

      - name: Verify lavapipe (diagnostic)
        run: xvfb-run -a vulkaninfo --summary

      - name: Build the Vulkan render gates
        run: |
          dotnet build validation/VsDrivenVulkan/VsDrivenVulkan.csproj -c Release
          dotnet build validation/CandidateVulkan/CandidateVulkan.csproj -c Release
          dotnet build validation/BaselineVulkan/BaselineVulkan.csproj -c Release

      # Every gate runs under validation/run-with-vk-validation.sh: the Khronos validation
      # layer is forced on, and any layer ERROR fails the step even when the pixels match.
      # A CPU driver can accept what a GPU driver rejects; the layer judges against the spec.
      - name: Vulkan VS-driven gate (ShadowDusk vs mgfxc 3.8.5 golden, real DesktopVK)
        run: validation/run-with-vk-validation.sh vsdriven -- xvfb-run -a dotnet run --project validation/VsDrivenVulkan -c Release --no-build

      - name: Vulkan Apos.Shapes gallery (issue #145 reproducer, real DesktopVK)
        if: ${{ !cancelled() }}
        run: validation/run-with-vk-validation.sh apos -- xvfb-run -a dotnet run --project validation/VsDrivenVulkan -c Release --no-build -- apos

      # Issue #229, EXPECT-DIAGNOSTIC: wave/quad intrinsics are not supported on Vulkan
      # (MonoGame's DesktopVK creates a Vulkan 1.0 instance with no subgroup support; the
      # SPIR-V 1.3 module they need rendered on lavapipe but failed this lane's validation
      # layer). The wave fixture must be rejected at compile time with SD0218 naming the
      # intrinsic. No device is created, so no xvfb or layer wrapper.
      - name: Vulkan wave/quad intrinsics rejected with SD0218 (issue #229)
        if: ${{ !cancelled() }}
        run: dotnet run --project validation/VsDrivenVulkan -c Release --no-build -- wave

      # Issue #324, EXPECT-DIAGNOSTIC: an ARRAY of textures (Texture2D Tex[2]) has no
      # representation in MonoGame's Vulkan effect format: real mgfxc 3.8.5 reflects it as no
      # parameter, no sampler record and no descriptor binding (the committed golden is decoded
      # to pin that), so ShadowDusk must refuse it with SD0221 at the declaration. No device.
      - name: Vulkan texture array rejected with SD0221 (issue #324)
        if: ${{ !cancelled() }}
        run: dotnet run --project validation/VsDrivenVulkan -c Release --no-build -- texarr

      # Own-output proof: mgfxc's Vulkan output for this corpus is unloadable (upstream
      # SlotOffset bug, see compare_vulkan.py), so BaselineVulkan is best-effort and
      # compare_vulkan.py fails only on a CANDIDATE problem. The validation layer is what
      # gives this gate teeth beyond "it did not crash".
      - name: Vulkan PS corpus (ShadowDusk own output, real DesktopVK)
        if: ${{ !cancelled() }}
        run: |
          validation/run-with-vk-validation.sh candidate -- xvfb-run -a dotnet run --project validation/CandidateVulkan -c Release --no-build
          xvfb-run -a dotnet run --project validation/BaselineVulkan -c Release --no-build || echo "BaselineVulkan best-effort (upstream mgfxc bug), not scored"
          python validation/compare_vulkan.py

      # POSITIVE CONTROLS: each plants a known defect in the candidate and the step passes
      # only if the gate turned RED for that reason. Without these, a lane that silently
      # stopped seeing pixels or stopped loading the layer would read as green.
      - name: Positive control, wrong shader must fail the pixel diff
        if: ${{ !cancelled() }}
        env:
          SHADOWDUSK_VK_CONTROL: wrong-shader
        run: validation/run-with-vk-validation.sh control-wrong-shader --expect-red 'CONTROL-DETECTED' -- xvfb-run -a dotnet run --project validation/VsDrivenVulkan -c Release --no-build

      - name: Positive control, out-of-spec SPIR-V must trip the validation layer
        if: ${{ !cancelled() }}
        env:
          SHADOWDUSK_VK_CONTROL: spirv-1.3-header
        run: validation/run-with-vk-validation.sh control-spirv-version --expect-red '(VkShaderModuleCreateInfo|vkCreateShaderModule|spirv-val)' -- xvfb-run -a dotnet run --project validation/VsDrivenVulkan -c Release --no-build

      - name: Upload render outputs + validation-layer logs (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-render-output-vulkan
          path: |
            validation/output/vsdriven-vulkan/**
            validation/output/vsdriven-vulkan-apos/**
            validation/output/vsdriven-vulkan-wave/**
            validation/output/candidate-vulkan/**
            validation/output/baseline-vulkan/**
            validation/output/diff-vulkan/**
            validation/output/vk-validation/**
          if-no-files-found: ignore
          retention-days: 7
