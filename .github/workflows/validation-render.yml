# .github/workflows/validation-render.yml
# Phase 44 C — promote the manual `validation/*` real-engine render gates into CI,
# where a software/headless driver exists.
#
# The product bar is "loads + renders like the reference compiler in the REAL engine"
# (CLAUDE.md). That bar lives in the validation/* console drivers, which `dotnet test`
# does NOT run. This workflow runs the ones that (a) render through a real MonoGame
# DesktopGL device and (b) self-assert in process (exit 0 iff every row matched the
# committed mgfxc golden within tolerance) — so they need no Python compare and no
# baseline-generation step. Mesa's llvmpipe software rasterizer under xvfb gives the
# headless runner a real GL 4.5 context (the same proven recipe wasm.yml uses for its
# DesktopGL reference renderer), so a GL-init failure is a NATURAL red (MonoGame throws
# NoSuitableGraphicsDevice -> non-zero exit), never a silent skip.
#
# GL render gates wired here (each is `Category`-free, self-asserting, net8.0 + DesktopGL):
#   * StateFidelity          — Phase 43 pass render-states / annotations / baked sampler
#                              states load + render vs mgfxc golden.
#   * CbufferModel           — Phase 43C cbuffer + array-parameter-by-name model.
#   * TextureBreadthValidation — Phase 34 cube + 3D/volume texture render (rung-4).
#   * ReservedWordGl         — Phase 45 B10 reserved-word free uniform ('float noise;')
#                              binds by name + drives the output on the GL offset-bridge
#                              path (exact expected pixels; no mgfxc needed in CI).
#   * SamplerPairsGl         — Phase 51 A7 per-(texture, sampler)-PAIR sampler records:
#                              each pair binds its own texture, and each carries its own
#                              baked sampler state, in SPIRV-Cross's declaration order
#                              (asymmetric scenes with exact expected pixels).
#   * SamplerRegisterOrderGl — issue #189: GL sampler SLOTS must follow HLSL declaration
#                              order (fxc's rule), not SPIRV-Cross's first-use order. The
#                              only GL gate that leaves unit 0 to SpriteBatch instead of
#                              binding every texture through effect.Parameters[...] — which
#                              is exactly what makes the slot numbering observable, and why
#                              every other gate stayed green while this shipped broken.
#   * DeferredSpriteMrtGl    — Phase 51 A2 true MULTIPLE-RENDER-TARGET proof: the ONLY
#                              gate here that binds two render targets and reads BOTH
#                              attachments back. Every other GL gate is single-target, so
#                              nothing else can tell "COLOR1 reached attachment 1" from
#                              "the second output went nowhere".
#   * ShaderToyRouteGl       — Phase 51 A5 the ShaderToy / `.glsl` FRONTEND route: convert
#                              in process, pin the result against the committed .fx the
#                              golden was built from, then render ShadowDusk's build and
#                              mgfxc's build of that same .fx and diff. The only gate that
#                              covers the converter -> pipeline route end to end.
#
# DX render gates wired here (issue #204, windows-latest, pinned to WARP — Windows'
# bundled software D3D rasterizer — via SHADOWDUSK_DX_WARP=1, same recipe proven in
# vchelaru/SkiaGameRendering's WindowsDX CI job; no driver install needed, unlike GL).
# All three measured GREEN on a real windows-latest run (not just a local GPU box):
#   * DxModernFeatures       — DX11 vertex-texture-fetch: vkd3d (shipping) vs
#                              d3dcompiler/fxc oracle, real MonoGame WindowsDX. The
#                              flagship gate here: single process, self-asserting exit
#                              code, no Python, no external mgfxc invocation.
#   * KniWinFormsDX          — DX11 ShadowDusk vs the committed mgfxc goldens, real KNI
#                              WinForms.DX11 (proves WARP extends to KNI's DX backend,
#                              which carries the pin on PresentationParameters rather
#                              than MonoGame's static GraphicsAdapter.UseDriverType).
#   * BaselineDx+CandidateDx+compare_dx.py — DX11 corpus, ShadowDusk vs the committed
#                              mgfxc DirectX_11 goldens, real MonoGame WindowsDX.
#   * BaselineDx12+CandidateDx12+compare_dx12.py — DX12 corpus (issue #209). Root cause of
#                              the original #204 RED: MonoGame.Framework.Native's SDL2
#                              window creation is compiled with SDL_WINDOW_VULKAN baked in
#                              for any DX12/Vulkan build (native/monogame/sdl/MGP_sdl.cpp,
#                              upstream MonoGame — not a runtime flag, no MonoGame-side or
#                              SDL hint exists to skip it), so SDL_CreateWindow always
#                              probes for a working Vulkan loader + WSI surface extensions
#                              regardless of the WARP pin, and windows-latest ships neither.
#                              Worked around by installing Google SwiftShader (a CPU Vulkan
#                              ICD) via jakoch/install-vulkan-sdk-action, which also drops a
#                              loader (`vulkan-1.dll`) next to the ICD — added to PATH so
#                              SDL's dlopen finds it. WARP still does the actual D3D12
#                              rendering; Vulkan here is load-bearing only for SDL's
#                              window-creation probe, never for a pixel.
#
# NOT here (issue #204 follow-ups, still manual-only via run-windows-render-gates.ps1):
#   * VsDrivenDx (Apos.Shapes gallery, real NuGet package) + ShaderToyRouteDx (converter
#     route) — heavier DX11 gates, left out of the day-one CI job on purpose; nothing
#     about WARP is expected to be different for them, they just weren't the smallest
#     first step.
#   * VsDrivenDx12 — same reasoning as VsDrivenDx; the issue #209 SwiftShader fix should
#     carry over (same SDL_WINDOW_VULKAN precondition), but wiring it in is a follow-up,
#     not the smallest next step.
#   * FNA (validation/FnaValidation) — needs its own restore-fna.ps1 (heavy, clones the
#     FNA source tree) and fxc /T fx_2_0, not evaluated for WARP here.
#   * Vulkan — WARP is a D3D-only software rasterizer; Vulkan needs Mesa lavapipe
#     instead (see SkiaGameRendering's own GL/Vulkan CI setup for that pattern).
#   * The Python-compare GL corpus (Baseline+Candidate+compare.py, VsDriven) — needs the
#     two-process baseline/candidate orchestration; the in-process GL gates above already
#     cover the regression-critical render shapes.
name: Validation Render Gates

on:
  # Standing regression coverage on main (the matrix's whole point: a validation/*
  # gate cannot silently rot). On PRs it is opt-in via the `run-validation-render`
  # label (GL-on-llvmpipe is environment-sensitive, so it does not block every PR);
  # plus manual dispatch. Mirrors the integration-tests cadence in ci.yml.
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'validation/**'
      - 'tests/fixtures/**'
      - '.github/workflows/validation-render.yml'
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled ]

# Least privilege for GITHUB_TOKEN: the GL render gates check out, build, render under
# llvmpipe, and upload the diff images as run artifacts. Nothing needs a write scope.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  gl-render-gates:
    name: GL render gates (ubuntu / Mesa llvmpipe)
    runs-on: ubuntu-latest
    # On a PR, only run when explicitly labelled run-validation-render (push-to-main and
    # manual dispatch always run). Keeps GL-on-software off the every-PR critical path.
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-validation-render')
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8 + .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The GL render path needs only DXC (Vortice.Dxc NuGet) + SPIRV-Cross
      # (Silk.NET.SPIRV.Cross.Native NuGet), both restored by `dotnet restore`. vkd3d is
      # NOT needed by these GL gates, so we do not hard-gate it here (unlike the DX/FNA
      # integration job). restore.sh is offline-tolerant; run it for parity only.
      - name: Restore native tools
        run: |
          chmod +x tools/restore.sh
          ./tools/restore.sh

      # Real GL rendering on a headless runner: MonoGame DesktopGL (SDL2) needs an X
      # display + a GL driver. xvfb provides the display, Mesa llvmpipe the software GL
      # context (advertises 4.5, covers the HiDef GraphicsProfile the gates request).
      # The libx*/libxkbcommon packages are SDL2's X11 client deps.
      - name: Install xvfb + Mesa software GL (DesktopGL render)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa mesa-utils \
            libx11-6 libxi6 libxrandr2 libxinerama1 libxcursor1 libxkbcommon0 \
            libsdl2-2.0-0

      # Put the driver evidence in the log (llvmpipe's advertised Compatibility version).
      - name: Verify llvmpipe GL (diagnostic)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a glxinfo -B || echo "::warning::glxinfo unavailable (diagnostic only)"

      - name: Build the GL render gates
        run: |
          dotnet build validation/StateFidelity/StateFidelity.csproj -c Release
          dotnet build validation/CbufferModel/CbufferModel.csproj -c Release
          dotnet build validation/TextureBreadthValidation/TextureBreadthValidation.csproj -c Release
          dotnet build validation/ReservedWordGl/ReservedWordGl.csproj -c Release
          dotnet build validation/SamplerPairsGl/SamplerPairsGl.csproj -c Release
          dotnet build validation/SamplerRegisterOrderGl/SamplerRegisterOrderGl.csproj -c Release
          dotnet build validation/DeferredSpriteMrtGl/DeferredSpriteMrtGl.csproj -c Release
          dotnet build validation/ShaderToyRouteGl/ShaderToyRouteGl.csproj -c Release

      # Each driver self-asserts (exit 0 iff every row loaded + matched its reference
      # within tolerance). Run all of them even if an earlier one fails, then fail the job
      # if any did, so one regression doesn't hide another. LIBGL_ALWAYS_SOFTWARE pins
      # llvmpipe even if a GPU device node exists, for deterministic software rendering.
      - name: Run GL render gates (real DesktopGL under xvfb/llvmpipe)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # No GL context => hard FAIL, never a pass-by-skip. StateFidelity/CbufferModel/
          # ReservedWordGl throw on a missing device (MonoGame NoSuitableGraphicsDevice ->
          # natural red); TextureBreadthValidation, SamplerPairsGl, SamplerRegisterOrderGl,
          # DeferredSpriteMrtGl and ShaderToyRouteGl catch+skip, so this flag turns their skip
          # into a failure too (all five read SHADOWDUSK_REQUIRE_GL).
          SHADOWDUSK_REQUIRE_GL: "1"
        run: |
          set +e
          rc=0
          for proj in StateFidelity CbufferModel TextureBreadthValidation ReservedWordGl SamplerPairsGl SamplerRegisterOrderGl DeferredSpriteMrtGl ShaderToyRouteGl; do
            echo "::group::$proj"
            xvfb-run -a dotnet run --project "validation/$proj" -c Release --no-build
            this=$?
            echo "::endgroup::"
            if [ "$this" -ne 0 ]; then
              echo "::error::validation/$proj render gate FAILED (exit $this)"
              rc=1
            fi
          done
          exit $rc

      - name: Upload render outputs (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-render-output
          path: |
            validation/output-state/**
            validation/output-cbuffer/**
            validation/output-texbreadth/**
            validation/output-reservedword/**
            validation/output-samplerpairs/**
            validation/output-samplerregisterorder/**
            validation/output-mrt/**
            validation/output-shadertoy/**
          if-no-files-found: ignore
          retention-days: 7

  dx-render-gates:
    name: DX render gates (windows-latest / WARP)
    runs-on: windows-latest
    # Same PR gating as the GL job: push-to-main and manual dispatch always run; a PR
    # only runs it when labelled (a Windows job is pricier CI minutes than Linux).
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-validation-render')
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8 + .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The DX gates need vkd3d-shader (the shipping DXBC backend) and DXC natives,
      # both win-x64 binaries fetched from this repo's own GitHub Releases (public,
      # no auth) by restore.ps1 — the same script the DX/KNI-DX/FNA integration tests
      # and run-windows-render-gates.ps1 already rely on.
      - name: Restore native tools (vkd3d-shader, DXC)
        run: ./tools/restore.ps1

      - name: Install Python compare dependencies (pillow, numpy)
        run: python -m pip install --disable-pip-version-check pillow numpy

      # Issue #209: MonoGame.Framework.Native's window creation is compiled with
      # SDL_WINDOW_VULKAN baked in for any DX12 build (see the header comment above), so
      # SDL_CreateWindow always dlopen's vulkan-1.dll and probes VK_KHR_surface/
      # VK_KHR_win32_surface, even though WARP does the actual D3D12 rendering. windows-latest
      # has neither a loader nor an ICD, so this installs Google SwiftShader (a CPU Vulkan
      # ICD) purely to satisfy that probe; the action registers it in the Vulkan ICD registry
      # for us, but does not add its bundled `vulkan-1.dll` to PATH, so the next step does.
      # Pinned to a commit SHA (v1.6.0), not the mutable tag, since this is a third-party
      # action.
      - name: Install Vulkan software driver (SwiftShader) for DX12 SDL2 window creation
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          install_swiftshader: true
          swiftshader_destination: C:\Swiftshader

      - name: Add SwiftShader's vulkan-1.dll loader to PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Swiftshader'

      - name: Build the DX render gates
        run: |
          dotnet build validation/DxModernFeatures/DxModernFeatures.csproj -c Release
          dotnet build validation/KniWinFormsDX/KniWinFormsDX.csproj -c Release
          dotnet build validation/BaselineDx/BaselineDx.csproj -c Release
          dotnet build validation/CandidateDx/CandidateDx.csproj -c Release
          dotnet build validation/BaselineDx12/BaselineDx12.csproj -c Release
          dotnet build validation/CandidateDx12/CandidateDx12.csproj -c Release

      # Issue #204: pin every gate to WARP (Windows' bundled software D3D rasterizer)
      # instead of a hardware adapter — windows-latest has no GPU. SHADOWDUSK_DX_WARP is
      # opt-in (see validation/SharedDx/DxHeadlessRasterizer.cs), so a developer's local
      # `dotnet run` still renders on their real GPU; only this job's env sets it.
      - name: Run DX11 modern-features gate (vkd3d vs fxc oracle, real MonoGame WindowsDX)
        env:
          SHADOWDUSK_DX_WARP: "1"
        run: dotnet run --project validation/DxModernFeatures -c Release --no-build

      - name: Run KNI DirectX gate (ShadowDusk vs mgfxc, real KNI WinForms.DX11)
        env:
          SHADOWDUSK_DX_WARP: "1"
        run: dotnet run --project validation/KniWinFormsDX -c Release --no-build

      - name: Run MonoGame WindowsDX corpus (ShadowDusk vs mgfxc DirectX_11 golden)
        env:
          SHADOWDUSK_DX_WARP: "1"
        run: |
          dotnet run --project validation/BaselineDx -c Release --no-build
          dotnet run --project validation/CandidateDx -c Release --no-build
          python validation/compare_dx.py

      - name: Run MonoGame WindowsDX12 corpus (ShadowDusk vs mgfxc DirectX_12 golden)
        env:
          SHADOWDUSK_DX_WARP: "1"
        run: |
          dotnet run --project validation/BaselineDx12 -c Release --no-build
          dotnet run --project validation/CandidateDx12 -c Release --no-build
          python validation/compare_dx12.py

      - name: Upload render outputs (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-render-output-dx
          path: |
            validation/output-dx/**
            validation/output/baseline-dx12/**
            validation/output/candidate-dx12/**
            validation/output/diff-dx12/**
          if-no-files-found: ignore
          retention-days: 7
