# .github/workflows/ci.yml
# Continuous integration: build + test on Linux, macOS, and Windows on every
# push/PR. This is Phase 30 §6, reconciled with the AS-BUILT native strategy:
#
#   * SPIRV-Cross (OpenGL path) ships TRANSITIVELY via the Silk.NET.SPIRV.Cross.Native
#     NuGet, and DXC via Vortice.Dxc — both are restored by `dotnet restore` and live
#     in the NuGet package cache. There is NO `tools/spirv-cross/` bundling step (the
#     doc's §3/§4 manual-bundle + native-versions.json model is OBSOLETE here).
#   * The DirectX DXBC backend's `vkd3d-shader` native is a RESTORED, non-redistributed
#     artifact. `tools/restore.*` verifies/recipes it and NO-OPs gracefully when absent
#     (vkd3d is opt-in; the default DXBC backend is the d3dcompiler_47 oracle). We run it
#     so the DX `.fx` reach path is exercised wherever a vkd3d binary is available.
name: CI

on:
  # Skip the build/test matrix for doc-/plan-only changes (READMEs, plan/, docs/, docfx/,
  # CHANGELOG, etc.) — they don't affect the build, so don't burn Actions minutes on them.
  push:
    branches: [ main ]
    paths-ignore: [ '**/*.md', 'plan/**', 'docs/**', 'docfx/**', 'LICENSE', '.gitignore' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**/*.md', 'plan/**', 'docs/**', 'docfx/**', 'LICENSE', '.gitignore' ]
  # On-demand run for any branch, so the matrix can be run against a branch before it has a
  # PR, or re-run on a head commit without pushing something to force it.
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: every job here only checks out, builds, tests, and
# uploads artifacts to its own run — none of which needs a write scope. Artifact up/download
# is not gated on GITHUB_TOKEN at all, and the native restore fetches release assets
# anonymously over https. A job that ever needs more must declare it on the job itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  lock-files:
    # Issue #291: `dotnet restore ShadowDusk.slnx --locked-mode` below covers only solution
    # projects. This restores EVERY tracked lock file (validation drivers, browser probes,
    # phase appendices) in locked mode, so a Directory.Packages.props change that misses an
    # out-of-solution lock file fails on its own PR instead of later in a label-gated job.
    name: Lock files (all projects, locked mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 + .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Locked-mode restore of every lock file
        run: tools/check-lock-files.sh

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Build + unit tests finish in ~1-3 min per OS; the ubuntu lane additionally renders
    # the ImageTests for real on Mesa llvmpipe (software rasterizer — slower than a GPU),
    # so 15 gives headroom. This also bounds the macOS `dotnet test` host-exit stall —
    # now fixed at the source (the GLFW init that left a non-background Cocoa thread is
    # skipped on macOS, see GlContextFixture), with this as the backstop. fail-fast:false
    # keeps each OS reporting independently.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8 + .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # NuGet cache carries the cross-platform native deps (SPIRV-Cross, DXC) — the
      # OpenGL + DXC in-memory path is self-contained from NuGet. Key on the lock files
      # and the central version pins so a dependency change invalidates the cache.
      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The pinned vkd3d-shader natives (all four RIDs) restore by download +
      # SHA-256 verify (Phase 37 C); cache them so the GitHub Release download
      # runs once per runner image, not per job. The restore script self-heals a
      # stale/corrupt cache (hash mismatch -> re-download).
      - name: Cache vkd3d natives
        uses: actions/cache@v5
        with:
          path: tools/vkd3d
          key: vkd3d-2.1-${{ runner.os }}

      # Same pattern for the pinned macOS DXC dylibs (Phase 37 A).
      - name: Cache DXC macOS natives
        uses: actions/cache@v5
        with:
          path: tools/dxc
          key: dxc-1.7.2212.40-android-x64-${{ runner.os }}

      # The Android SPIRV-Cross natives (android-arm64 packed, android-x64 for the emulator lane;
      # ~80 MB together), keyed on restore.sh so a re-pin invalidates it. restore.* re-verifies
      # the SHA-256 of a cached file and re-downloads on a mismatch.
      - name: Cache Android SPIRV-Cross natives
        uses: actions/cache@v5
        with:
          path: |
            tools/spirv-cross/android-arm64
            tools/spirv-cross/android-x64
          key: spirv-cross-android-${{ runner.os }}-${{ hashFiles('tools/restore.sh', 'tools/restore.ps1') }}

      # Restore the vkd3d-shader natives (DirectX DXBC backend + the FNA target's
      # engine) and the macOS DXC dylibs (OpenGL frontend on macOS, Phase 37 A).
      # A failed pinned DOWNLOAD only warns (the script is offline-tolerant by design;
      # vkd3d-dependent tests skip / fail SD0211 loudly) — but the script's own exit
      # code is honored: do NOT wrap it in `|| true` (that once swallowed every restore
      # failure; restore.sh exits 0 for the optional spirv-cross miss since 2026-06-12,
      # so a non-zero exit is a genuine script failure that must go red).
      - name: Restore native tools (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x tools/restore.sh
          ./tools/restore.sh

      - name: Restore native tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/restore.ps1

      - name: dotnet restore
        run: dotnet restore ShadowDusk.slnx --locked-mode

      - name: dotnet build
        run: dotnet build ShadowDusk.slnx --no-restore -c Release

      # ── Real GL rendering on the ubuntu lane (Phase 37 verification tail, items 3+4) ──
      # ubuntu runners are headless: without a display GlContextFixture cannot create its
      # GL 3.3 Compatibility context and every ImageTests render test SOFT-SKIPS AS PASS.
      # That soft-skip once fabricated "27/27 green in 73 ms" runs that never invoked DXC,
      # masking a total Linux compile failure (Phase 37 Finding B). Mirror wasm.yml's
      # proven browser-smoke recipe — xvfb (X virtual framebuffer) + Mesa llvmpipe
      # (software GL; Mesa 24.x on ubuntu-latest advertises 4.5 Compatibility, covering
      # the fixture's deliberate 3.3 Compatibility request) — so the lane actually renders
      # the golden corpus. The extra libx*/libxkbcommon packages are GLFW's X11 client
      # deps (the wasm.yml recipe used SDL via MonoGame; ImageTests use GLFW via Silk.NET).
      - name: Install xvfb + Mesa software GL (ImageTests real rendering)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa mesa-utils \
            libx11-6 libxi6 libxrandr2 libxinerama1 libxcursor1 libxkbcommon0

      # Empirical check (not assumed): print the Compatibility-profile version llvmpipe
      # actually advertises under xvfb. The hard gate is SHADOWDUSK_REQUIRE_GL below —
      # if the fixture can't create its 3.3 Compatibility context, the test step FAILS
      # loudly — but this line puts the driver evidence in the log for humans.
      - name: Verify llvmpipe GL Compatibility profile (diagnostic)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a glxinfo -B

      # Unit tests on the fast PR path (Category!=Integration).
      #
      # Phase34TextureBreadthTests live-compile the advanced 3D-texture / explicit-LOD /
      # gradient-sampling shaders (Phase 34's HiDef examples). These COMPILE on Windows but
      # currently FAIL to compile on the Linux/macOS DXC build (the cross-platform reach gap
      # for those specific intrinsics — see the Phase 30 known-gaps note in the PR). They
      # run on Windows only until that discrepancy is investigated. Everything else —
      # including the same-machine MgfxcCrossValidation cross-val and the ImageRegression
      # render proxy — runs on every OS, so cross-platform COMPILE reach for the normal
      # corpus is proven here, with the integration job as the heavier end-to-end check.
      #
      # GL-render coverage per lane (Phase 37 tail items 3+4):
      #   * ubuntu  — RENDERS FOR REAL under xvfb-run + llvmpipe. SHADOWDUSK_REQUIRE_GL=1
      #               makes "no GL context" a hard failure, so a regression back to the
      #               silent headless soft-skip turns this lane red instead of green.
      #   * windows — SOFT-SKIPS (visibly): windows-latest runners expose only GDI Generic
      #               OpenGL 1.1, so the GL 3.3 Compatibility context cannot be created.
      #               Real-GPU GL coverage for Windows is the local dev run (the suite
      #               renders fully there); do NOT set SHADOWDUSK_REQUIRE_GL here.
      #   * macos   — SOFT-SKIPS (visibly) BY PLATFORM DESIGN: Apple caps the native GL
      #               Compatibility profile at 2.1 and GLFW cannot exit cleanly headless
      #               (see GlContextFixture). This is the remaining platform wall.
      # LogFilePrefix, NOT LogFileName. `dotnet test` on the solution runs 14 assemblies
      # (7 projects x net8.0/net10.0) concurrently, and a fixed LogFileName makes all 14
      # write ONE file: the logs were full of "WARNING: Overwriting results file", and the
      # uploaded artifact held whichever assembly happened to finish last — 13 results
      # silently lost. LogFilePrefix emits <prefix>_<tfm>_<timestamp>.trx per assembly
      # (measured: 14 files, zero overwrite warnings). See the integration job below for
      # why this is more than tidiness.
      - name: dotnet test (unit, Windows — full; GL renders only on GPU-equipped hosts)
        if: runner.os == 'Windows'
        run: >
          dotnet test ShadowDusk.slnx --no-build -c Release
          --filter "(Category!=Integration|Category=Fidelity)"
          --logger "trx;LogFilePrefix=unit-${{ matrix.os }}"
          --results-directory TestResults/

      # Diagnostic for the GLFW native (the previous, pre-xvfb soft-skip reason on this
      # runner family was "GlfwPlatform - not applicable" = Glfw.GetApi() could not LOAD
      # libglfw.so.3 — not a display problem; the identical bin output loads fine in a
      # headless Debian 12 container and in WSL2 ubuntu-24.04). Prints presence + linkage
      # so a load failure here is diagnosable from the log instead of a Silk.NET one-liner.
      - name: GLFW native load diagnostic
        if: runner.os == 'Linux'
        run: |
          so=$(find tests/ShadowDusk.ImageTests/bin -path "*linux-x64*" -name "libglfw.so.3" | head -n1)
          if [ -z "$so" ]; then
            echo "::warning::libglfw.so.3 NOT in ImageTests bin output (runtimes/linux-x64/native)"
            echo "--- ultz.native.glfw in NuGet cache ---"
            find ~/.nuget/packages/ultz.native.glfw -type f 2>/dev/null || echo "(absent from cache)"
          else
            ls -la "$so"; file "$so" || true; ldd "$so" || true
          fi

      # Phase34LodGradRenderTests run on Linux again (Phase 43 F7 closed the watch
      # item): the emitted form is now the legacy `texture2DLod`/`texture2DGrad` +
      # MojoShader's guarded extension header, which Mesa's strict GLSL front-end
      # accepts (the old generic `textureLod`/`textureGrad` spelling was rejected in
      # the implicit-#version-110 legacy dialect — "no function with name
      # 'textureLod'", llvmpipe Mesa 22.3.6 + 25.2.8, 2026-06-11; the PR #48
      # exclusion masked exactly that). This lane IS the referee for the fix.
      # (Phase34TextureBreadthTests stay excluded — that is the separate per-OS DXC
      # COMPILE divergence for 3D/LOD/grad intrinsics, Phase 43 F11, not a Mesa
      # dialect issue. Phase34LodGradRenderTests.SampleLevel also live-compiles its
      # fixture; if the Linux DXC divergence bites it, that failure is F11 evidence
      # and must be handled there, not re-masked here.)
      - name: dotnet test (unit, Linux — REAL GL render under xvfb/llvmpipe, REQUIRE_GL hard gate)
        if: runner.os == 'Linux'
        env:
          # Pin Mesa's software rasterizer even if a GPU device node exists (same as wasm.yml).
          LIBGL_ALWAYS_SOFTWARE: "1"
          # Phase 37 tail item 4: no GL context => ImageTests FAIL loudly, never pass-by-skip.
          SHADOWDUSK_REQUIRE_GL: "1"
        run: >
          xvfb-run -a dotnet test ShadowDusk.slnx --no-build -c Release
          --filter "(Category!=Integration|Category=Fidelity)&FullyQualifiedName!~Phase34TextureBreadthTests"
          --logger "trx;LogFilePrefix=unit-${{ matrix.os }}"
          --results-directory TestResults/

      - name: dotnet test (unit, macOS — advanced-texture compile tests excluded; GL proxy N/A)
        if: runner.os == 'macOS'
        run: >
          dotnet test ShadowDusk.slnx --no-build -c Release
          --filter "(Category!=Integration|Category=Fidelity)&FullyQualifiedName!~Phase34TextureBreadthTests"
          --logger "trx;LogFilePrefix=unit-${{ matrix.os }}"
          --results-directory TestResults/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          retention-days: 7

  # Slow path: integration tests (CLI child-process spawn + native DXC/SPIRV-Cross).
  # Runs automatically on pushes to main; on PRs only when the 'run-integration'
  # label is applied (heavyweight + AV-scan-sensitive, see CLAUDE.md Phase 21).
  integration-tests:
    name: Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-and-test
    # Heavier than the unit gate (CLI child-process spawn + native DXC/SPIRV-Cross). The test
    # step caps each assembly's session at 11 min and itself at 14 (see the step); 20 leaves
    # room for setup, restore, build (about 3 min) and the artifact uploads after a failure.
    timeout-minutes: 20
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'run-integration')
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8 + .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache vkd3d natives
        uses: actions/cache@v5
        with:
          path: tools/vkd3d
          key: vkd3d-2.1-${{ runner.os }}

      - name: Cache DXC macOS natives
        uses: actions/cache@v5
        with:
          path: tools/dxc
          key: dxc-1.7.2212.40-android-x64-${{ runner.os }}

      # The Android SPIRV-Cross natives (android-arm64 packed, android-x64 for the emulator lane;
      # ~80 MB together), keyed on restore.sh so a re-pin invalidates it. restore.* re-verifies
      # the SHA-256 of a cached file and re-downloads on a mismatch.
      - name: Cache Android SPIRV-Cross natives
        uses: actions/cache@v5
        with:
          path: |
            tools/spirv-cross/android-arm64
            tools/spirv-cross/android-x64
          key: spirv-cross-android-${{ runner.os }}-${{ hashFiles('tools/restore.sh', 'tools/restore.ps1') }}

      # slangc for all four RIDs (ShadowDusk.Slang, issue #227): ~170 MB of release zips to
      # download otherwise. The restore scripts hash-verify every file, so a stale or corrupt
      # cache entry self-heals.
      - name: Cache slangc natives
        uses: actions/cache@v5
        with:
          path: tools/slang
          key: slang-2026.14.1-${{ runner.os }}

      - name: Restore native tools (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x tools/restore.sh
          ./tools/restore.sh

      - name: Restore native tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/restore.ps1

      # HARD GATE on the restored natives (the soft-skip-chain fix, 2026-06-12 review):
      # the restore script's download failures are warnings by design (offline
      # tolerance), but in CI the pinned assets are hosted — a missing file here means
      # the restore infrastructure failed, and the job must go red BEFORE the test run
      # can quietly skip the vkd3d/DXC-gated suites green. All four vkd3d RIDs are
      # asserted on every OS (every machine must be pack-ready, see tools/restore.*).
      - name: Verify restored natives present (hard gate)
        shell: bash
        run: |
          missing=0
          for f in \
            'tools/vkd3d/libvkd3d-shader-1.dll' \
            'tools/vkd3d/libvkd3d-shader.so.1' \
            'tools/vkd3d/osx-x64/libvkd3d-shader.1.dylib' \
            'tools/vkd3d/osx-arm64/libvkd3d-shader.1.dylib' \
            'tools/dxc/osx-x64/libdxcompiler.dylib' \
            'tools/dxc/osx-arm64/libdxcompiler.dylib' \
            'tools/dxc/android-arm64/libdxcompiler.so' \
            'tools/dxc/android-x64/libdxcompiler.so' \
            'tools/spirv-cross/android-arm64/libspirv-cross.so' \
            'tools/spirv-cross/android-x64/libspirv-cross.so' \
            'tools/slang/win-x64/slangc.exe' \
            'tools/slang/win-x64/slang-compiler.dll' \
            'tools/slang/linux-x64/slangc' \
            'tools/slang/linux-x64/libslang-compiler.so.0.2026.14.1' \
            'tools/slang/osx-x64/slangc' \
            'tools/slang/osx-x64/libslang-compiler.0.2026.14.1.dylib' \
            'tools/slang/osx-arm64/slangc' \
            'tools/slang/osx-arm64/libslang-compiler.0.2026.14.1.dylib' ; do
              if [ ! -f "$f" ]; then
                echo "::error::restored native missing: $f — tools/restore.* failed to provision a hosted, pinned asset (download/cache failure). The vkd3d/DXC/slangc integration tests would fail or skip; failing the job here with the real cause instead."
                missing=1
              fi
          done
          exit $missing

      - name: dotnet restore
        run: dotnet restore ShadowDusk.slnx --locked-mode

      - name: dotnet build
        run: dotnet build ShadowDusk.slnx --no-restore -c Release

      # The suite-level TestSessionTimeout guardrail (Phase 21) backstops the per-test
      # CancellationToken timeouts so a cold-AV-scan hang fails in bounded time instead of
      # eating 20+ minutes. ShadowDusk.runsettings sets it to 5 minutes, which is right for the
      # unit lanes; THIS step overrides it to 10 (see the hang-guard note below for why).
      #
      # SHADOWDUSK_REQUIRE_VKD3D / SHADOWDUSK_REQUIRE_DXC (the attribute-level analog
      # of SHADOWDUSK_REQUIRE_GL): the natives were just hard-gated above, so inside
      # the test run a missing native is a FAILURE, never a skip — defense in depth
      # against a probe/loader regression re-opening the skip-as-green hole.
      # Full xUnit parallelism on EVERY OS, macOS included. macOS used to run with
      # MaxParallelThreads=1 on a "resource exhaustion" diagnosis; the real cause was DXC's Unix
      # support code (LLVM signal handlers over the runtime's, a racy signal-table overflow,
      # and setlocale deadlocking against fork()), fixed in ShadowDusk.HLSL's
      # DxcSignalIsolation/DxcForkGate. Capping parallelism only hid it, so do not reintroduce
      # the cap: a host crash here is a real defect.
      # LogFilePrefix is load-bearing HERE, not cosmetic. The ubuntu lane intermittently
      # aborts with "Test host process crashed" (Phase 51 A9), and the crashed assembly's
      # .trx is exactly the artifact needed to diagnose it — but under the old fixed
      # LogFileName every assembly wrote the same file, so the crashed one was overwritten
      # by whichever assembly finished afterwards. That is why the crash has been
      # re-derived from scratch three times from log adjacency alone (and mis-attributed:
      # see project_facts.md). One file per assembly means the next occurrence leaves
      # evidence instead of a guess.
      # --blame-hang-timeout is the hang guard. A test's CancellationToken cannot interrupt a
      # native compile (one uninterruptible P/Invoke), so only this can turn a hung native call
      # into a failure, and it dumps every thread's stack (the host's and its children's) while
      # doing it. What it has to clear is the longest stretch in which a healthy host records no
      # test event at all (issue #351, measured from every .trx of 74 CI runs per lane before
      # -m:2): 39 s on ubuntu, 42 s on macOS, and 176 s on windows-latest, which -m:2 removes
      # (the numbers after it, and the headroom, are in project_rules.md).
      #
      # THE TWO TIMEOUTS MUST AGREE (issue #312). The blame timer is an INACTIVITY timer: every
      # test that starts or finishes anywhere in the assembly resets it, so it fires 3 minutes
      # after the LAST test event, not 3 minutes after the stuck test began. The session
      # timeout is absolute, and it aborts the run with NO dump. With the old 5-minute session
      # cap a dump was only possible for a stall whose last test event came before minute 2,
      # while a healthy run of this suite takes up to 3.5 minutes on a loaded runner: a late
      # stall always lost the race (macOS, run 37063450434: stalled 3 min 48 s, no dump). The
      # rule is
      #     TestSessionTimeout >= slowest healthy assembly run + blame-hang-timeout + dump time
      #     11 min             >= 6 min budget                 + 3 min              + 1 min + 1 min slack
      # (the dump is a FULL dump, so dotnet-dump can print managed stacks: 378 MB and 1.2 s for an
      # Integration test host with DXC loaded, measured locally 2026-10-04; a CI full dump of a
      # smaller host was written well inside a minute)
      # so any stall in a run that was otherwise on schedule is dumped before the session cap
      # can pre-empt it. CiHangGuardTests enforces that inequality against this file; change
      # both numbers together. xunit.runner.json (longRunningTestSeconds) also names every test
      # that has been running over a minute, so even an undumped stall says which tests it held.
      #
      # timeout-minutes on the step, not just the job: a step timeout FAILS the step, so the
      # `failure()` uploads below still run; a job timeout cancels them. Assemblies run in
      # parallel, so the step's wall time is about one session (11 min) at worst.
      # The DXC fork/setlocale probes (DxcConcurrencyStressTests, issue #256) run in a child of
      # the test host. If one hangs, HangDiagnostics attaches gdb and createdump to it before the
      # watchdog kills it; --blame-hang only ever dumps the host. Attaching to a sibling needs
      # ptrace_scope 0, and gdb is installed best-effort (createdump alone still gives a core).
      - name: Allow hang-probe native stack capture (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.yama.ptrace_scope=0
          command -v gdb >/dev/null || sudo apt-get install -y --no-install-recommends gdb \
            || echo "::warning::gdb unavailable; a probe hang will leave only a createdump core"

      # Issue #312: the blame-hang dump cannot be relied on for the stall shape seen on macOS.
      # A handful of tests freeze while every other test keeps starting and finishing, so the
      # blame inactivity timer is reset for as long as the rest of the suite runs; and when it
      # does fire, VSTest asks the runtime to dump itself, which the runtime does by fork()ing
      # createdump INSIDE the hung process. On macOS that fork runs the pthread_atfork handlers,
      # DxcForkGate's included, so a host hung with a compile stuck under that gate can never
      # dump itself. This sidecar is a separate shell process: after 5 minutes (a healthy
      # macOS integration assembly finishes in under 2.5, the Slang one in under 3.5) it takes
      # native stacks (lldb / gdb), a `sample`, and a createdump of every test host still
      # running, then a second stack snapshot, into TestResults/hang-dumps/. On a healthy run
      # it finds nothing and exits 0; it can never fail the step. tools/ci/hang-watchdog.sh.
      - name: Start the stall watchdog (sidecar, issue #312)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p TestResults/hang-dumps
          chmod +x tools/ci/hang-watchdog.sh
          nohup tools/ci/hang-watchdog.sh "$PWD/TestResults/hang-dumps" 300 45 \
            > TestResults/hang-dumps/watchdog.log 2>&1 &
          echo $! > TestResults/hang-dumps/watchdog.pid
          echo "stall watchdog started, pid $(cat TestResults/hang-dumps/watchdog.pid)"

      # AT MOST TWO TEST HOSTS AT ONCE (-m:2, issue #373). `dotnet test` on the solution starts
      # one test host per assembly and TFM, up to one per core, and each runs four xUnit
      # collections that compile on further threads and spawn slangc / CLI children. On the
      # 4-vCPU windows-latest runner that kept the run queue at 20 to 60 for the whole step, and
      # one host at a time then made no progress at all for 40 to 176 s (measured over 74 CI
      # runs, 2026-10-02 to 2026-10-03; a 45 s blame dump of one caught it blocked in
      # Thread.Start, waiting for a new OS thread to begin, with every native compiler idle).
      # Every 30 and 60 s test budget that expired on Windows (#373, #316) was a test inside such
      # a stall. Two hosts at a time leaves the step's wall time unchanged (the runner is CPU
      # bound either way) and, measured on 4 pinned cores, cut the slowest test from 95 s to 34 s
      # and the longest no-progress gap to 16 s. Do not raise it without re-measuring the gaps
      # (project_rules.md, "Integration lane load").
      - name: dotnet test (integration)
        timeout-minutes: 14
        env:
          SHADOWDUSK_REQUIRE_VKD3D: "1"
          SHADOWDUSK_REQUIRE_DXC: "1"
          SHADOWDUSK_HANG_DUMP_DIR: ${{ github.workspace }}/TestResults/probe-hangs
        run: >
          dotnet test ShadowDusk.slnx --no-build -c Release -m:2
          --filter "Category=Integration"
          --settings ShadowDusk.runsettings
          --blame-hang-timeout 3m --blame-hang-dump-type full
          --logger "trx;LogFilePrefix=integration-${{ matrix.os }}"
          --results-directory TestResults/
          -- RunConfiguration.TestSessionTimeout=660000

      # The sidecar's log goes into the job log either way, so a healthy run shows "nothing to
      # capture" and a stalled one shows what was captured. A watchdog still sleeping (the tests
      # finished first) is stopped here. Never fails.
      - name: Stop the stall watchdog and show what it captured
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f TestResults/hang-dumps/watchdog.pid ]; then
            pid=$(cat TestResults/hang-dumps/watchdog.pid)
            if kill -0 "$pid" 2>/dev/null; then
              # Give a capture in progress a moment to finish writing before stopping it.
              for _ in $(seq 1 90); do
                grep -q 'watchdog done' TestResults/hang-dumps/watchdog.log 2>/dev/null && break
                grep -q 'nothing to capture' TestResults/hang-dumps/watchdog.log 2>/dev/null && break
                if ! grep -q 'capturing pid' TestResults/hang-dumps/watchdog.log 2>/dev/null; then break; fi
                sleep 1
              done
              kill "$pid" 2>/dev/null || true
              echo "stall watchdog (pid $pid) stopped"
            fi
          fi
          echo "--- watchdog.log"
          cat TestResults/hang-dumps/watchdog.log 2>/dev/null || echo "(no watchdog log)"
          echo "--- TestResults/hang-dumps"
          ls -la TestResults/hang-dumps 2>/dev/null || true
          rm -f TestResults/hang-dumps/watchdog.pid
          # A dump is analyzed HERE, where the matching runtime and the symbol server are at
          # hand, so the artifact carries the managed stacks and sync blocks as text and never
          # depends on another machine being able to open a macOS core.
          shopt -s nullglob
          dumps=(TestResults/hang-dumps/*.dmp)
          if [ "${#dumps[@]}" -gt 0 ]; then
            dotnet tool install -g dotnet-dump >/dev/null 2>&1 || dotnet tool update -g dotnet-dump >/dev/null 2>&1 || true
            export PATH="$PATH:$HOME/.dotnet/tools"
            for d in "${dumps[@]}"; do
              echo "--- dotnet-dump analyze $d"
              dotnet-dump analyze "$d" -c "threads" -c "clrstack -all" -c "syncblk" -c "exit" \
                > "${d%.dmp}-managed.txt" 2>&1 || echo "dotnet-dump analyze failed for $d (see ${d%.dmp}-managed.txt)"
              head -c 20000 "${d%.dmp}-managed.txt"
            done
          fi

      # A blame-hang dump of a Windows test host, turned into managed stacks HERE (issue #373),
      # where the matching runtime is at hand, so the uploaded hang-dumps artifact carries them
      # as text. This is how the #373 stall was read: the frozen host's thread was in
      # Thread.StartCore. Never fails.
      - name: Analyze blame-hang dumps (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumps = Get-ChildItem TestResults -Recurse -Filter *.dmp -ErrorAction SilentlyContinue
          if (-not $dumps) { Write-Host "no hang dumps"; exit 0 }
          New-Item -ItemType Directory -Force -Path TestResults/hang-dumps | Out-Null
          dotnet tool install -g dotnet-dump 2>&1 | Out-Null
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          foreach ($d in $dumps) {
            $txt = Join-Path 'TestResults/hang-dumps' ($d.BaseName + '-managed.txt')
            Write-Host "--- $($d.FullName) ($([int]($d.Length / 1MB)) MB)"
            dotnet-dump analyze $d.FullName -c "threads" -c "threadpool" -c "clrstack -all" -c "syncblk" -c "exit" *> $txt
            Get-Content $txt -TotalCount 400
          }
          exit 0

      # Guard the line above: if someone reverts to a fixed LogFileName, the run still goes
      # green while 13 of 14 assemblies' results vanish. The solution always has more than
      # one test assembly, so "exactly one .trx" can only mean they collided. `always()` so
      # this also runs after the crash it exists to make diagnosable.
      - name: Assert per-assembly test results were kept
        if: always()
        # This job's matrix includes windows-latest, where `run:` would otherwise be pwsh.
        shell: bash
        run: |
          shopt -s nullglob
          files=(TestResults/*.trx)
          n=${#files[@]}
          echo "trx files: $n"
          if [ "$n" -le 1 ]; then
            echo "::error::Expected one .trx per test assembly, found $n — the trx logger is writing a single shared file again (use LogFilePrefix, not LogFileName)."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-${{ matrix.os }}
          path: TestResults/*.trx
          retention-days: 14

      # cancelled() too: if the job timeout ever does fire, the dumps taken so far still upload.
      # TestResults/hang-dumps is the sidecar's output (stacks, sample, createdump, its log);
      # TestResults/probe-hangs holds the probe-child evidence and the test host's own stall hint.
      - name: Upload hang dumps
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: integration-hang-dumps-${{ matrix.os }}
          path: |
            TestResults/**/*.dmp
            TestResults/**/Sequence_*.xml
            TestResults/probe-hangs/*.txt
            TestResults/hang-dumps/**
          retention-days: 14
          if-no-files-found: ignore
