# .github/workflows/build-vkd3d-natives.yml
# Build the pinned vkd3d-shader native binaries for every shipping desktop RID.
# WineHQ ships source tarballs only, so all four are built here:
#
#   * osx-arm64  — macos-14 (Apple Silicon) native build
#   * osx-x64    — macos-15-intel (the last free x86_64 image) native build
#   * linux-x64  — ubuntu:20.04 container = glibc 2.31 baseline (the oldest distro
#                  we claim to support)
#   * win-x64    — MSYS2 MINGW64, the same toolchain the Phase 18/39/40 recipe used;
#                  it was a local build until Phase 56 moved it here so all four RIDs
#                  share one auditable provenance
#
# The version is a dispatch input so a bump does not need a workflow edit; the
# tarball SHA-256 is an input too and is verified before anything is built, so a
# tampered or moved tarball can never silently change the shipped compiler.
#
# The artifacts produced here are uploaded as run artifacts. Attaching them to the
# fixed hosting release tag (`native-vkd3d-<version>`, whose SHA-256 pins live in
# tools/restore.{sh,ps1}) is a deliberate MANUAL step: re-running this workflow
# never republishes anything.
#
# Pin discipline: output byte-stability is a product promise, so a bump re-baselines
# every DirectX/FNA golden and re-runs rung-4. Never substitute a distro build.
name: Build vkd3d natives

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'vkd3d release to build (e.g. 2.1)'
        required: true
        default: '2.1'
      tarball_sha256:
        description: 'SHA-256 of vkd3d-<version>.tar.xz as published by WineHQ'
        required: true
        default: '7510146aff2adfb4ae07ab890701a607e5ff7c66e57100cfc9f630ec92eeda6a'

# Least privilege for GITHUB_TOKEN. This workflow only builds the natives and uploads them
# as run artifacts; a maintainer attaches them to the pinned release by hand, so nothing
# here needs a write scope. Artifact upload is not gated on GITHUB_TOKEN.
permissions:
  contents: read

env:
  VKD3D_VERSION: ${{ inputs.version }}
  VKD3D_TARBALL_URL: 'https://dl.winehq.org/vkd3d/source/vkd3d-${{ inputs.version }}.tar.xz'
  VKD3D_TARBALL_SHA256: ${{ inputs.tarball_sha256 }}
  VKD3D_SRC: 'vkd3d-${{ inputs.version }}'

jobs:
  build-macos:
    name: Build ${{ matrix.rid }} dylib
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-14
          - rid: osx-x64
            os: macos-15-intel
    steps:
      - name: Check out (smoke-test script)
        uses: actions/checkout@v5

      - name: Download + verify pinned tarball
        run: |
          curl -fsSLo vkd3d.tar.xz "$VKD3D_TARBALL_URL"
          echo "$VKD3D_TARBALL_SHA256  vkd3d.tar.xz" | shasum -a 256 -c -
          tar xf vkd3d.tar.xz

      # bison/flex: vkd3d's HLSL lexer/parser need modern bison (macOS ships 2.3).
      # vulkan/spirv headers are compile-time only — header-only packages cannot
      # introduce a Homebrew runtime dependency (the otool gate below proves it).
      # perl JSON: a hard configure requirement (build-script tooling, not linked).
      - name: Install build deps (Homebrew, headers + build tools only)
        run: |
          brew install bison flex vulkan-headers spirv-headers cpanminus
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          cpanm --local-lib="$HOME/perl5" --notest JSON
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> "$GITHUB_ENV"

      # MACOSX_DEPLOYMENT_TARGET=11.0: the macOS glibc-baseline analog (Phase 37 C
      # addendum caution). 11.0 = first arm64 macOS; .NET 8 itself needs 12+, so this
      # leaves headroom rather than inheriting the builder image's 14/15 default.
      # SONAME_LIBVULKAN bypasses configure's hard requirement for an installed
      # Vulkan loader (same trick as the win-x64 MSYS2 recipe): the soname is only
      # dlopen'd at RUNTIME by libvkd3d proper, which we don't build or ship —
      # libvkd3d-shader links no Vulkan at all (the otool gate proves it).
      - name: Configure + build libvkd3d-shader
        working-directory: ${{ env.VKD3D_SRC }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          ./configure CFLAGS='-O2' \
            SONAME_LIBVULKAN=libvulkan.1.dylib \
            CPPFLAGS="-I$(brew --prefix vulkan-headers)/include -I$(brew --prefix spirv-headers)/include"
          make include/private/vkd3d_version.h   # lib-only target misses this dep
          make -j"$(sysctl -n hw.ncpu)" libvkd3d-shader.la
          ls -la .libs/

      - name: Smoke-test (vkd3d-compiler, SM3 incl. dynamic loop)
        working-directory: ${{ env.VKD3D_SRC }}
        run: |
          make -j"$(sysctl -n hw.ncpu)" vkd3d-compiler
          bash "$GITHUB_WORKSPACE/.github/scripts/vkd3d-smoke.sh" ./vkd3d-compiler

      # The addendum's hard gate: the dylib must link SYSTEM libraries only. Any
      # Homebrew (/opt/homebrew, /usr/local) runtime dependency means the binary
      # would not run on a consumer's Mac -> fail red here, not on a user machine.
      - name: Verify system-only linkage + arch + deployment target (otool/lipo)
        working-directory: ${{ env.VKD3D_SRC }}
        run: |
          dylib=$(ls .libs/libvkd3d-shader.*.dylib | head -1)
          echo "== otool -L $dylib =="
          otool -L "$dylib"
          # Line 1 is the file header, line 2 the dylib's OWN install name (self-ID,
          # not a dependency) — real dependencies start at line 3.
          bad=$(otool -L "$dylib" | tail -n +3 | awk '{print $1}' \
                | grep -vE '^(/usr/lib/|/System/)' || true)
          if [ -n "$bad" ]; then
            echo "::error::non-system linkage found: $bad"
            exit 1
          fi
          echo "== lipo -info =="
          lipo -info "$dylib"
          echo "== minos (build version) =="
          otool -l "$dylib" | grep -A3 'LC_BUILD_VERSION\|LC_VERSION_MIN' || true

      - name: Stage artifact
        run: |
          mkdir -p out
          # libtool emits libvkd3d-shader.<N>.dylib; ship it under the SONAME-style
          # name the loader/csproj expect.
          cp "$VKD3D_SRC"/.libs/libvkd3d-shader.*.dylib out/libvkd3d-shader.1.dylib
          shasum -a 256 out/libvkd3d-shader.1.dylib | tee out/libvkd3d-shader.1.dylib.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vkd3d-${{ env.VKD3D_VERSION }}-${{ matrix.rid }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Build linux-x64 .so (glibc 2.31 baseline)
    runs-on: ubuntu-latest
    # Ubuntu 20.04 container = glibc 2.31, the oldest supported baseline. Matches the
    # recipe in tools/restore.sh (verified on 24.04 in Phase 39) but built old enough
    # to honor the 20.04+ support claim.
    container: ubuntu:20.04
    timeout-minutes: 45
    steps:
      - name: Install build deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential flex bison libvulkan-dev spirv-headers libjson-perl \
            xz-utils pkg-config curl ca-certificates binutils

      - name: Check out (smoke-test script)
        uses: actions/checkout@v5

      - name: Download + verify pinned tarball
        run: |
          curl -fsSLo vkd3d.tar.xz "$VKD3D_TARBALL_URL"
          echo "$VKD3D_TARBALL_SHA256  vkd3d.tar.xz" | sha256sum -c -
          tar xf vkd3d.tar.xz

      # Ubuntu 20.04 ships Vulkan headers 1.2.131; vkd3d requires >= 1.3.228.
      # Vulkan-Headers is header-ONLY (compile-time), so taking it from a pinned
      # upstream tag cannot move the glibc baseline the 20.04 container provides.
      - name: Fetch pinned Vulkan-Headers (20.04's are too old; header-only)
        run: |
          curl -fsSL https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.3.296.tar.gz | tar xz
          echo "VULKAN_HEADERS_INC=$(pwd)/Vulkan-Headers-1.3.296/include" >> "$GITHUB_ENV"

      - name: Configure + build libvkd3d-shader
        working-directory: ${{ env.VKD3D_SRC }}
        run: |
          ./configure CFLAGS='-O2' LDFLAGS='-static-libgcc' \
            CPPFLAGS="-I$VULKAN_HEADERS_INC"
          make include/private/vkd3d_version.h
          make -j"$(nproc)" libvkd3d-shader.la
          ls -la .libs/

      - name: Smoke-test (vkd3d-compiler, SM3 incl. dynamic loop)
        working-directory: ${{ env.VKD3D_SRC }}
        run: |
          make -j"$(nproc)" vkd3d-compiler
          bash "$GITHUB_WORKSPACE/.github/scripts/vkd3d-smoke.sh" ./vkd3d-compiler

      # The whole point of the 20.04 build: no glibc symbol newer than 2.31, and
      # runtime deps limited to libc/libm (+ the loader). Fail red otherwise.
      - name: Verify glibc baseline + runtime deps
        working-directory: ${{ env.VKD3D_SRC }}
        run: |
          so=$(ls .libs/libvkd3d-shader.so.1.* | head -1)
          echo "== NEEDED =="
          objdump -p "$so" | grep NEEDED
          # libpthread/libdl/librt are glibc components (merged into libc.so.6
          # only in glibc 2.34) — system libraries on the 2.31 baseline.
          bad_needed=$(objdump -p "$so" | awk '/NEEDED/{print $2}' \
                       | grep -vE '^(libc\.so|libm\.so|libpthread\.so|libdl\.so|librt\.so|ld-linux)' || true)
          if [ -n "$bad_needed" ]; then
            echo "::error::unexpected runtime dependency: $bad_needed"
            exit 1
          fi
          max_glibc=$(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -u -t_ -k2,2V | tail -1)
          echo "max glibc symbol version: $max_glibc"
          case "$max_glibc" in
            GLIBC_2.3[01]|GLIBC_2.[12]?|GLIBC_2.[0-9]) echo "glibc baseline OK" ;;
            *) echo "::error::glibc symbol $max_glibc exceeds the 2.31 (Ubuntu 20.04) baseline"; exit 1 ;;
          esac

      - name: Stage artifact
        run: |
          mkdir -p out
          cp "$VKD3D_SRC"/.libs/libvkd3d-shader.so.1.* out/libvkd3d-shader.so.1
          sha256sum out/libvkd3d-shader.so.1 | tee out/libvkd3d-shader.so.1.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vkd3d-${{ env.VKD3D_VERSION }}-linux-x64
          path: out/*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build win-x64 dll (MSYS2 MINGW64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # MINGW64 is a NATIVE x86_64-w64-mingw32 environment, so configure detects that
      # triple on its own. The historical `--host=x86_64-w64-mingw32` from the local
      # recipe is redundant here and would push configure into cross-compile mode
      # hunting for a prefixed gcc that MINGW64 does not ship.
      - name: Set up MSYS2 + MINGW64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            bison
            flex
            tar
            xz
            curl
            perl
            perl-JSON
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-spirv-headers

      - name: Check out (smoke-test script)
        uses: actions/checkout@v5

      - name: Download + verify pinned tarball
        run: |
          curl -fsSLo vkd3d.tar.xz "$VKD3D_TARBALL_URL"
          echo "$VKD3D_TARBALL_SHA256  vkd3d.tar.xz" | sha256sum -c -
          tar xf vkd3d.tar.xz

      # SONAME_LIBVULKAN bypasses configure's hard requirement for an installed Vulkan
      # loader — that soname is only dlopen'd at runtime by libvkd3d proper, which we
      # neither build nor ship. The static libgcc/winpthread link is what keeps the dll
      # free of MSYS2 runtime dependencies on a consumer machine (objdump gate below).
      - name: Configure + build libvkd3d-shader
        working-directory: ${{ env.VKD3D_SRC }}
        run: |
          ./configure CFLAGS='-O2' \
            SONAME_LIBVULKAN=vulkan-1.dll \
            LDFLAGS="-static-libgcc -Wl,-Bstatic -lwinpthread -Wl,-Bdynamic"
          make include/private/vkd3d_version.h
          make -j"$(nproc)" libvkd3d-shader.la
          ls -la .libs/

      - name: Smoke-test (vkd3d-compiler, SM3 incl. dynamic loop)
        working-directory: ${{ env.VKD3D_SRC }}
        run: |
          make -j"$(nproc)" vkd3d-compiler
          bash "$GITHUB_WORKSPACE/.github/scripts/vkd3d-smoke.sh" ./vkd3d-compiler.exe

      # The dll must depend on SYSTEM dlls only. A leaked libgcc_s_seh-1.dll,
      # libwinpthread-1.dll or msys-2.0.dll means the binary would not load on a
      # consumer Windows box -> fail red here, not on a user machine.
      - name: Verify system-only linkage (objdump)
        working-directory: ${{ env.VKD3D_SRC }}
        run: |
          dll=$(ls .libs/libvkd3d-shader-1.dll | head -1)
          echo "== DLL Name dependencies =="
          objdump -p "$dll" | grep 'DLL Name'
          bad=$(objdump -p "$dll" | awk '/DLL Name/{print tolower($3)}' \
                | grep -E '^(libgcc|libwinpthread|msys-|libstdc)' || true)
          if [ -n "$bad" ]; then
            echo "::error::non-system linkage found: $bad"
            exit 1
          fi
          echo "system-only linkage OK"

      - name: Stage artifact
        run: |
          mkdir -p out
          cp "$VKD3D_SRC"/.libs/libvkd3d-shader-1.dll out/libvkd3d-shader-1.dll
          sha256sum out/libvkd3d-shader-1.dll | tee out/libvkd3d-shader-1.dll.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vkd3d-${{ env.VKD3D_VERSION }}-win-x64
          path: out/*
          if-no-files-found: error
          retention-days: 30
